<svg width="1600" height="800" viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah-032858" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#032858"/></marker><marker id="ah-97EF29" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#97EF29"/></marker><marker id="ah-5F5F5F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F5F5F"/></marker><marker id="ah-7AD91F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7AD91F"/></marker><marker id="ah-0869D4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0869D4"/></marker><marker id="ah-9CA3AF" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/></marker><linearGradient id="heroNavy" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#032858"/><stop offset="50%" stop-color="#0A3A6B"/><stop offset="100%" stop-color="#032858"/></linearGradient><linearGradient id="airy" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="40%" stop-color="#F0F4FF"/><stop offset="70%" stop-color="#E8F9FF"/><stop offset="100%" stop-color="#FFFFFF"/></linearGradient><linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#CFEEB0"/><stop offset="100%" stop-color="#97EF29"/></linearGradient></defs><rect width="1600" height="800" fill="#FFFFFF"/><text x="60" y="78" font-family="Lufga ExtraBold" font-size="34" fill="#032858" text-anchor="start">How “Get Quotes” works — one request, a market of offers</text><rect x="62" y="94" width="70" height="5" rx="2.5" fill="#97EF29"/><text x="60" y="128" font-family="Lufga" font-size="16" fill="#5F5F5F" text-anchor="start">The customer describes what they need, once. Clinket privately shares it with the right nearby providers — who then compete for the job.</text><rect x="60" y="200" width="332" height="152" rx="16" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="82" y="218" width="70" height="22" rx="11" fill="#E8F9FF"/><text x="117.07" y="233.5" font-family="Lufga Medium" font-size="11.5" fill="#032858" text-anchor="middle">CUSTOMER</text><text x="370" y="234" font-family="Lufga ExtraBold" font-size="20" fill="#D4F9A0" text-anchor="end">1</text><text x="82" y="268" font-family="Lufga SemiBold" font-size="16.5" fill="#032858" text-anchor="start">Describe the job once</text><text x="82" y="294" font-family="Lufga" font-size="12.7" fill="#5F5F5F" text-anchor="start">Type it, speak it, or add photos —</text><text x="82" y="313" font-family="Lufga" font-size="12.7" fill="#5F5F5F" text-anchor="start">the leaky tap, the car, the hair length</text><rect x="442" y="200" width="332" height="152" rx="16" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="464" y="218" width="83" height="22" rx="11" fill="#032858"/><text x="505.3375" y="233.5" font-family="Lufga Medium" font-size="11.5" fill="#FFFFFF" text-anchor="middle">CLINKET AI</text><text x="752" y="234" font-family="Lufga ExtraBold" font-size="20" fill="#D4F9A0" text-anchor="end">2</text><text x="464" y="268" font-family="Lufga SemiBold" font-size="16.5" fill="#032858" text-anchor="start">Clinket understands it</text><text x="464" y="294" font-family="Lufga" font-size="12.7" fill="#5F5F5F" text-anchor="start">It works out the type of job and the</text><text x="464" y="313" font-family="Lufga" font-size="12.7" fill="#5F5F5F" text-anchor="start">area on its own — no forms, no menus</text><rect x="824" y="200" width="332" height="152" rx="16" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="846" y="218" width="83" height="22" rx="11" fill="#032858"/><text x="887.3375" y="233.5" font-family="Lufga Medium" font-size="11.5" fill="#FFFFFF" text-anchor="middle">CLINKET AI</text><text x="1134" y="234" font-family="Lufga ExtraBold" font-size="20" fill="#D4F9A0" text-anchor="end">3</text><text x="846" y="268" font-family="Lufga SemiBold" font-size="16.5" fill="#032858" text-anchor="start">The right providers get it</text><text x="846" y="294" font-family="Lufga" font-size="12.7" fill="#5F5F5F" text-anchor="start">Nearby, relevant, well-rated providers;</text><text x="846" y="313" font-family="Lufga" font-size="12.7" fill="#5F5F5F" text-anchor="start">premium members see it first — but</text><text x="846" y="332" font-family="Lufga" font-size="12.7" fill="#5F5F5F" text-anchor="start">everyone gets a fair chance</text><rect x="1206" y="200" width="332" height="152" rx="16" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="1228" y="218" width="76" height="22" rx="11" fill="#F4FFE4"/><text x="1266.20375" y="233.5" font-family="Lufga Medium" font-size="11.5" fill="#032858" text-anchor="middle">PROVIDERS</text><text x="1516" y="234" font-family="Lufga ExtraBold" font-size="20" fill="#D4F9A0" text-anchor="end">4</text><text x="1228" y="268" font-family="Lufga SemiBold" font-size="16.5" fill="#032858" text-anchor="start">Providers see a new lead</text><text x="1228" y="294" font-family="Lufga" font-size="12.7" fill="#5F5F5F" text-anchor="start">Full job details — but who the customer</text><text x="1228" y="313" font-family="Lufga" font-size="12.7" fill="#5F5F5F" text-anchor="start">is stays private until they choose</text><rect x="1015.0" y="412" width="332" height="152" rx="16" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="1037.0" y="430" width="76" height="22" rx="11" fill="#F4FFE4"/><text x="1075.20375" y="445.5" font-family="Lufga Medium" font-size="11.5" fill="#032858" text-anchor="middle">PROVIDERS</text><text x="1325.0" y="446" font-family="Lufga ExtraBold" font-size="20" fill="#D4F9A0" text-anchor="end">5</text><text x="1037.0" y="480" font-family="Lufga SemiBold" font-size="16.5" fill="#032858" text-anchor="start">Providers compete</text><text x="1037.0" y="506" font-family="Lufga" font-size="12.7" fill="#5F5F5F" text-anchor="start">Offer a price, ask questions, show</text><text x="1037.0" y="525" font-family="Lufga" font-size="12.7" fill="#5F5F5F" text-anchor="start">their ratings and past work</text><rect x="633.0" y="412" width="332" height="152" rx="16" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="655.0" y="430" width="70" height="22" rx="11" fill="#E8F9FF"/><text x="690.07" y="445.5" font-family="Lufga Medium" font-size="11.5" fill="#032858" text-anchor="middle">CUSTOMER</text><text x="943.0" y="446" font-family="Lufga ExtraBold" font-size="20" fill="#D4F9A0" text-anchor="end">6</text><text x="655.0" y="480" font-family="Lufga SemiBold" font-size="16.5" fill="#032858" text-anchor="start">Customer picks a winner</text><text x="655.0" y="506" font-family="Lufga" font-size="12.7" fill="#5F5F5F" text-anchor="start">Compare every offer side-by-side,</text><text x="655.0" y="525" font-family="Lufga" font-size="12.7" fill="#5F5F5F" text-anchor="start">then pick with one tap</text><rect x="251.0" y="412" width="332" height="152" rx="16" fill="url(#heroNavy)" stroke="#032858" stroke-width="0" /><rect x="273.0" y="430" width="83" height="22" rx="11" fill="#97EF29"/><text x="314.3375" y="445.5" font-family="Lufga Medium" font-size="11.5" fill="#032858" text-anchor="middle">CLINKET AI</text><text x="561.0" y="446" font-family="Lufga ExtraBold" font-size="20" fill="#97EF29" text-anchor="end">7</text><text x="273.0" y="480" font-family="Lufga SemiBold" font-size="16.5" fill="#FFFFFF" text-anchor="start">Deal happens end-to-end</text><text x="273.0" y="506" font-family="Lufga" font-size="12.7" fill="#BFD3EA" text-anchor="start">Contact shared → booking → safe</text><text x="273.0" y="525" font-family="Lufga" font-size="12.7" fill="#BFD3EA" text-anchor="start">payment → job done → review</text><line x1="396" y1="276.0" x2="436" y2="276.0" stroke="#7AD91F" stroke-width="2.6" marker-end="url(#ah-7AD91F)"/><line x1="778" y1="276.0" x2="818" y2="276.0" stroke="#7AD91F" stroke-width="2.6" marker-end="url(#ah-7AD91F)"/><line x1="1160" y1="276.0" x2="1200" y2="276.0" stroke="#7AD91F" stroke-width="2.6" marker-end="url(#ah-7AD91F)"/><path d="M 1372.0 356 L 1372.0 382.0 L 1181.0 382.0 L 1181.0 404" fill="none" stroke="#7AD91F" stroke-width="2.6" marker-end="url(#ah-7AD91F)"/><line x1="1011.0" y1="488.0" x2="973.0" y2="488.0" stroke="#7AD91F" stroke-width="2.6" marker-end="url(#ah-7AD91F)"/><line x1="629.0" y1="488.0" x2="591.0" y2="488.0" stroke="#7AD91F" stroke-width="2.6" marker-end="url(#ah-7AD91F)"/><rect x="60" y="608" width="1480" height="92" rx="16" fill="#F0F4FF" stroke="#D9E2F5" stroke-width="1.2" /><text x="92" y="646" font-family="Lufga SemiBold" font-size="15.5" fill="#032858" text-anchor="start">Privacy by design</text><text x="92" y="671" font-family="Lufga" font-size="13.5" fill="#171717" text-anchor="start">The customer decides if and when their phone or email is shared. Providers bid on the job, not on the person — no data resale, ever.</text><line x1="60" y1="754" x2="1540" y2="754" stroke="#E7E7E7" stroke-width="1"/><g transform="translate(60,766) scale(0.4)">
<rect width="50" height="50" rx="10.84" fill="#97EF29"/>
