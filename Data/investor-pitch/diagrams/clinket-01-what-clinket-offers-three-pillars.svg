<svg width="1600" height="830" viewBox="0 0 1600 830" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah-032858" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#032858"/></marker><marker id="ah-97EF29" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#97EF29"/></marker><marker id="ah-5F5F5F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F5F5F"/></marker><marker id="ah-7AD91F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7AD91F"/></marker><marker id="ah-0869D4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0869D4"/></marker><marker id="ah-9CA3AF" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/></marker><linearGradient id="heroNavy" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#032858"/><stop offset="50%" stop-color="#0A3A6B"/><stop offset="100%" stop-color="#032858"/></linearGradient><linearGradient id="airy" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="40%" stop-color="#F0F4FF"/><stop offset="70%" stop-color="#E8F9FF"/><stop offset="100%" stop-color="#FFFFFF"/></linearGradient><linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#CFEEB0"/><stop offset="100%" stop-color="#97EF29"/></linearGradient></defs><rect width="1600" height="830" fill="#FFFFFF"/><text x="60" y="78" font-family="Lufga ExtraBold" font-size="34" fill="#032858" text-anchor="start">The Clinket platform — three offerings, one engine</text><rect x="62" y="94" width="70" height="5" rx="2.5" fill="#97EF29"/><text x="60" y="128" font-family="Lufga" font-size="16" fill="#5F5F5F" text-anchor="start">Providers adopt one pillar or all three. Every pillar feeds the same customers, data and AI.</text><rect x="60" y="175" width="470" height="348" rx="18" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="60" y="175" width="470" height="8" rx="4" fill="#5BE7FF"/><circle cx="104" cy="227" r="20" fill="#E8F9FF" stroke="#5BE7FF" stroke-width="1.5"/><text x="104" y="234" font-family="Lufga ExtraBold" font-size="19" fill="#032858" text-anchor="middle">1</text><text x="136" y="223" font-family="Lufga SemiBold" font-size="20" fill="#032858" text-anchor="start">Marketplace + e-commerce</text><text x="136" y="247" font-family="Lufga" font-size="13.5" fill="#5F5F5F" text-anchor="start">Every local service, one front door</text><circle cx="94" cy="288" r="3.5" fill="#97EF29"/><text x="110" y="293" font-family="Lufga" font-size="14.5" fill="#171717" text-anchor="start">Google-simple search — answers on the first screen</text><circle cx="94" cy="320" r="3.5" fill="#97EF29"/><text x="110" y="325" font-family="Lufga" font-size="14.5" fill="#171717" text-anchor="start">Honest profiles: ratings, photos of past work, clear pricing</text><circle cx="94" cy="352" r="3.5" fill="#97EF29"/><text x="110" y="357" font-family="Lufga" font-size="14.5" fill="#171717" text-anchor="start">Chat, call, voice notes, WhatsApp — privacy-controlled</text><circle cx="94" cy="384" r="3.5" fill="#97EF29"/><text x="110" y="389" font-family="Lufga" font-size="14.5" fill="#171717" text-anchor="start">Book and pay online — funds held until the job is done</text><circle cx="94" cy="416" r="3.5" fill="#97EF29"/><text x="110" y="421" font-family="Lufga" font-size="14.5" fill="#171717" text-anchor="start">Refunds, disputes and support built in, Amazon-style</text><text x="90" y="499" font-family="Lufga Medium" font-size="13" fill="#5F5F5F" text-anchor="start">For customers: one app for every need</text><rect x="555" y="175" width="470" height="348" rx="18" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="555" y="175" width="470" height="8" rx="4" fill="#97EF29"/><circle cx="599" cy="227" r="20" fill="#F4FFE4" stroke="#97EF29" stroke-width="1.5"/><text x="599" y="234" font-family="Lufga ExtraBold" font-size="19" fill="#032858" text-anchor="middle">2</text><text x="631" y="223" font-family="Lufga SemiBold" font-size="20" fill="#032858" text-anchor="start">Free tools to run the business</text><text x="631" y="247" font-family="Lufga" font-size="13.5" fill="#5F5F5F" text-anchor="start">A ready-made back office — $0</text><circle cx="589" cy="288" r="3.5" fill="#97EF29"/><text x="605" y="293" font-family="Lufga" font-size="14.5" fill="#171717" text-anchor="start">Bookings, quotes and invoices with payment links</text><circle cx="589" cy="320" r="3.5" fill="#97EF29"/><text x="605" y="325" font-family="Lufga" font-size="14.5" fill="#171717" text-anchor="start">Their own customer book, built in — on or off Clinket</text><circle cx="589" cy="352" r="3.5" fill="#97EF29"/><text x="605" y="357" font-family="Lufga" font-size="14.5" fill="#171717" text-anchor="start">Auto-generated personal website with booking + QR code</text><circle cx="589" cy="384" r="3.5" fill="#97EF29"/><text x="605" y="389" font-family="Lufga" font-size="14.5" fill="#171717" text-anchor="start">Offers and campaigns pushed to their customer base</text><circle cx="589" cy="416" r="3.5" fill="#97EF29"/><text x="605" y="421" font-family="Lufga" font-size="14.5" fill="#171717" text-anchor="start">Free of charge — the on-ramp for every small business</text><text x="585" y="499" font-family="Lufga Medium" font-size="13" fill="#5F5F5F" text-anchor="start">For providers: run everything in one place</text><rect x="1050" y="175" width="470" height="348" rx="18" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="1050" y="175" width="470" height="8" rx="4" fill="#0869D4"/><circle cx="1094" cy="227" r="20" fill="#F0F4FF" stroke="#0869D4" stroke-width="1.5"/><text x="1094" y="234" font-family="Lufga ExtraBold" font-size="19" fill="#032858" text-anchor="middle">3</text><text x="1126" y="223" font-family="Lufga SemiBold" font-size="20" fill="#032858" text-anchor="start">AI Assistant + Receptionist</text><text x="1126" y="247" font-family="Lufga" font-size="13.5" fill="#5F5F5F" text-anchor="start">Never miss a call, a lead or an order</text><circle cx="1084" cy="288" r="3.5" fill="#97EF29"/><text x="1100" y="293" font-family="Lufga" font-size="14.5" fill="#171717" text-anchor="start">Answers missed calls 24/7 and books real appointments</text><circle cx="1084" cy="320" r="3.5" fill="#97EF29"/><text x="1100" y="325" font-family="Lufga" font-size="14.5" fill="#171717" text-anchor="start">Creates quotes, orders and customer records from the call</text><circle cx="1084" cy="352" r="3.5" fill="#97EF29"/><text x="1100" y="357" font-family="Lufga" font-size="14.5" fill="#171717" text-anchor="start">Follows the owner’s instructions — “no pepperoni today”</text><circle cx="1084" cy="384" r="3.5" fill="#97EF29"/><text x="1100" y="389" font-family="Lufga" font-size="14.5" fill="#171717" text-anchor="start">Owner can watch the call live and take over anytime</text><circle cx="1084" cy="416" r="3.5" fill="#97EF29"/><text x="1100" y="421" font-family="Lufga" font-size="14.5" fill="#171717" text-anchor="start">Every call summarized — with the actions it took</text><text x="1080" y="499" font-family="Lufga Medium" font-size="13" fill="#5F5F5F" text-anchor="start">For any business — even off the marketplace</text><rect x="60" y="561" width="1480" height="118" rx="18" fill="url(#heroNavy)" stroke="#032858" stroke-width="0" /><text x="92" y="607" font-family="Lufga SemiBold" font-size="18" fill="#FFFFFF" text-anchor="start">One shared engine underneath</text><text x="92" y="633" font-family="Lufga" font-size="13" fill="#BFD3EA" text-anchor="start">Every pillar runs on the same platform services:</text><rect x="430" y="591" width="104" height="28" rx="14.0" fill="#0A3A78" stroke="#0A4A8A" stroke-width="1"/><text x="481.9675" y="609.68" font-family="Lufga Medium" font-size="13" fill="#FFFFFF" text-anchor="middle">AI matching</text><rect x="542.935" y="591" width="111" height="28" rx="14.0" fill="#0A3A78" stroke="#0A4A8A" stroke-width="1"/><text x="598.4449999999999" y="609.68" font-family="Lufga Medium" font-size="13" fill="#FFFFFF" text-anchor="middle">Smart search</text><rect x="662.9549999999999" y="591" width="146" height="28" rx="14.0" fill="#0A3A78" stroke="#0A4A8A" stroke-width="1"/><text x="736.1774999999999" y="609.68" font-family="Lufga Medium" font-size="13" fill="#FFFFFF" text-anchor="middle">Customer insights</text><rect x="818.3999999999999" y="591" width="154" height="28" rx="14.0" fill="#0A3A78" stroke="#0A4A8A" stroke-width="1"/><text x="895.1649999999998" y="609.68" font-family="Lufga Medium" font-size="13" fill="#FFFFFF" text-anchor="middle">Payments + refunds</text><rect x="980.9299999999998" y="591" width="168" height="28" rx="14.0" fill="#0A3A78" stroke="#0A4A8A" stroke-width="1"/><text x="1064.7799999999997" y="609.68" font-family="Lufga Medium" font-size="13" fill="#FFFFFF" text-anchor="middle">Messaging + WhatsApp</text><rect x="1157.6299999999999" y="591" width="118" height="28" rx="14.0" fill="#0A3A78" stroke="#0A4A8A" stroke-width="1"/><text x="1216.6825" y="609.68" font-family="Lufga Medium" font-size="13" fill="#FFFFFF" text-anchor="middle">Notifications</text><rect x="1284.735" y="591" width="132" height="28" rx="14.0" fill="#0A3A78" stroke="#0A4A8A" stroke-width="1"/><text x="1350.8725" y="609.68" font-family="Lufga Medium" font-size="13" fill="#FFFFFF" text-anchor="middle">Recommendations</text><rect x="430" y="629" width="154" height="28" rx="14.0" fill="#0A3A78" stroke="#0A4A8A" stroke-width="1"/><text x="506.765" y="647.68" font-family="Lufga Medium" font-size="13" fill="#FFFFFF" text-anchor="middle">Photos + documents</text><line x1="60" y1="784" x2="1540" y2="784" stroke="#E7E7E7" stroke-width="1"/><g transform="translate(60,796) scale(0.4)">
