<svg width="1600" height="800" viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah-032858" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#032858"/></marker><marker id="ah-97EF29" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#97EF29"/></marker><marker id="ah-5F5F5F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F5F5F"/></marker><marker id="ah-7AD91F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7AD91F"/></marker><marker id="ah-0869D4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0869D4"/></marker><marker id="ah-9CA3AF" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/></marker><linearGradient id="heroNavy" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#032858"/><stop offset="50%" stop-color="#0A3A6B"/><stop offset="100%" stop-color="#032858"/></linearGradient><linearGradient id="airy" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="40%" stop-color="#F0F4FF"/><stop offset="70%" stop-color="#E8F9FF"/><stop offset="100%" stop-color="#FFFFFF"/></linearGradient><linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#CFEEB0"/><stop offset="100%" stop-color="#97EF29"/></linearGradient></defs><rect width="1600" height="800" fill="#FFFFFF"/><text x="60" y="78" font-family="Lufga ExtraBold" font-size="34" fill="#032858" text-anchor="start">How Clinket makes money — built today, compounding tomorrow</text><rect x="62" y="94" width="70" height="5" rx="2.5" fill="#97EF29"/><text x="60" y="128" font-family="Lufga" font-size="16" fill="#5F5F5F" text-anchor="start">Recurring subscription revenue is live in the product now; three larger engines are unlocked by the same data and scale.</text><rect x="60" y="175" width="734.0" height="370" rx="18" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="60" y="175" width="734.0" height="8" rx="4" fill="#97EF29"/><text x="92" y="227" font-family="Lufga SemiBold" font-size="20" fill="#032858" text-anchor="start">Live in the product today</text><text x="92" y="253" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">Recurring, self-serve, already approved on Apple + Google billing</text><rect x="92" y="267" width="4" height="20" rx="2" fill="#97EF29"/><text x="108" y="283" font-family="Lufga SemiBold" font-size="16" fill="#032858" text-anchor="start">Provider subscriptions</text><text x="108" y="307.0" font-family="Lufga" font-size="13.2" fill="#5F5F5F" text-anchor="start">Free · Basic · Premium · Premium Max — monthly lead quotas,</text><text x="108" y="326.5" font-family="Lufga" font-size="13.2" fill="#5F5F5F" text-anchor="start">head-start on every lead, deep analytics, featured banners,</text><text x="108" y="346.0" font-family="Lufga" font-size="13.2" fill="#5F5F5F" text-anchor="start">WhatsApp allowances. Free tier never starves — it upsells.</text><rect x="92" y="371.5" width="4" height="20" rx="2" fill="#97EF29"/><text x="108" y="387.5" font-family="Lufga SemiBold" font-size="16" fill="#032858" text-anchor="start">AI Receptionist plans</text><text x="108" y="411.5" font-family="Lufga" font-size="13.2" fill="#5F5F5F" text-anchor="start">Standard and Advanced intelligence tiers + usage minutes —</text><text x="108" y="431.0" font-family="Lufga" font-size="13.2" fill="#5F5F5F" text-anchor="start">phone-plan mechanics: top-ups and auto-recharge included.</text><rect x="92" y="456.5" width="4" height="20" rx="2" fill="#97EF29"/><text x="108" y="472.5" font-family="Lufga SemiBold" font-size="16" fill="#032858" text-anchor="start">Promotions + loyalty engine</text><text x="108" y="496.5" font-family="Lufga" font-size="13.2" fill="#5F5F5F" text-anchor="start">Free trials, personalized promo codes and targeted offers,</text><text x="108" y="516.0" font-family="Lufga" font-size="13.2" fill="#5F5F5F" text-anchor="start">delivered in-app and by email — built and live today.</text><rect x="806.0" y="175" width="734.0" height="370" rx="18" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="806.0" y="175" width="734.0" height="8" rx="4" fill="#032858"/><text x="838.0" y="227" font-family="Lufga SemiBold" font-size="20" fill="#032858" text-anchor="start">What the same data unlocks next</text><text x="838.0" y="253" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">Each one can outgrow subscriptions — and could even make the core free</text><rect x="838.0" y="267" width="4" height="20" rx="2" fill="#032858"/><text x="854.0" y="283" font-family="Lufga SemiBold" font-size="16" fill="#032858" text-anchor="start">Precision B2B advertising</text><text x="854.0" y="307.0" font-family="Lufga" font-size="13.2" fill="#5F5F5F" text-anchor="start">Wholesalers reach exactly the right trades — and our analytics</text><text x="854.0" y="326.5" font-family="Lufga" font-size="13.2" fill="#5F5F5F" text-anchor="start">knows which pages and placements each provider engages with</text><text x="854.0" y="346.0" font-family="Lufga" font-size="13.2" fill="#5F5F5F" text-anchor="start">most, so every ad lands where it&#x27;s seen. Win-win-win.</text><rect x="838.0" y="371.5" width="4" height="20" rx="2" fill="#032858"/><text x="854.0" y="387.5" font-family="Lufga SemiBold" font-size="16" fill="#032858" text-anchor="start">Clinket-branded services</text><text x="854.0" y="411.5" font-family="Lufga" font-size="13.2" fill="#5F5F5F" text-anchor="start">The Kirkland / Amazon Basics play: launch or lease out own-brand</text><text x="854.0" y="431.0" font-family="Lufga" font-size="13.2" fill="#5F5F5F" text-anchor="start">services in areas where demand data proves the market.</text><rect x="838.0" y="456.5" width="4" height="20" rx="2" fill="#032858"/><text x="854.0" y="472.5" font-family="Lufga SemiBold" font-size="16" fill="#032858" text-anchor="start">Selective transaction fees</text><text x="854.0" y="496.5" font-family="Lufga" font-size="13.2" fill="#5F5F5F" text-anchor="start">A small fee only on categories we choose — e.g. buy-and-sell or</text><text x="854.0" y="516.0" font-family="Lufga" font-size="13.2" fill="#5F5F5F" text-anchor="start">delivery — deliberately not a tax on every service booking.</text><rect x="60" y="581" width="1480" height="108" rx="18" fill="url(#heroNavy)" stroke="#032858" stroke-width="0" /><text x="92" y="625" font-family="Lufga SemiBold" font-size="18" fill="#FFFFFF" text-anchor="start">The horizon: embedded finance, then one app for everything</text><text x="92" y="653" font-family="Lufga" font-size="13.5" fill="#BFD3EA" text-anchor="start">Job financing, point-of-service insurance, data-backed provider loans — then bills, transit and payments: the WeChat / Paytm playbook for North America.</text><line x1="60" y1="754" x2="1540" y2="754" stroke="#E7E7E7" stroke-width="1"/><g transform="translate(60,766) scale(0.4)">
<rect width="50" height="50" rx="10.84" fill="#97EF29"/>
