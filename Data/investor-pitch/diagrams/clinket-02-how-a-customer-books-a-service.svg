<svg width="1600" height="700" viewBox="0 0 1600 700" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah-032858" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#032858"/></marker><marker id="ah-97EF29" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#97EF29"/></marker><marker id="ah-5F5F5F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F5F5F"/></marker><marker id="ah-7AD91F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7AD91F"/></marker><marker id="ah-0869D4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0869D4"/></marker><marker id="ah-9CA3AF" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/></marker><linearGradient id="heroNavy" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#032858"/><stop offset="50%" stop-color="#0A3A6B"/><stop offset="100%" stop-color="#032858"/></linearGradient><linearGradient id="airy" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="40%" stop-color="#F0F4FF"/><stop offset="70%" stop-color="#E8F9FF"/><stop offset="100%" stop-color="#FFFFFF"/></linearGradient><linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#CFEEB0"/><stop offset="100%" stop-color="#97EF29"/></linearGradient></defs><rect width="1600" height="700" fill="#FFFFFF"/><text x="60" y="78" font-family="Lufga ExtraBold" font-size="34" fill="#032858" text-anchor="start">Booking a service on Clinket — the customer journey</text><rect x="62" y="94" width="70" height="5" rx="2.5" fill="#97EF29"/><text x="60" y="128" font-family="Lufga" font-size="16" fill="#5F5F5F" text-anchor="start">From “I need a plumber” to a completed, protected job — without a single phone call chase.</text><rect x="60.0" y="210" width="205" height="210" rx="16" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><circle cx="162.5" cy="254" r="23" fill="#F4FFE4" stroke="#97EF29" stroke-width="2"/><text x="162.5" y="262" font-family="Lufga ExtraBold" font-size="19" fill="#032858" text-anchor="middle">1</text><text x="162.5" y="306" font-family="Lufga SemiBold" font-size="17" fill="#032858" text-anchor="middle">Search</text><text x="162.5" y="336" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="middle">Type a need like a</text><text x="162.5" y="355" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="middle">Google search — every</text><text x="162.5" y="374" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="middle">answer on one screen</text><line x1="271.0" y1="315.0" x2="307.0" y2="315.0" stroke="#7AD91F" stroke-width="2.6" marker-end="url(#ah-7AD91F)"/><rect x="315.0" y="210" width="205" height="210" rx="16" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><circle cx="417.5" cy="254" r="23" fill="#F4FFE4" stroke="#97EF29" stroke-width="2"/><text x="417.5" y="262" font-family="Lufga ExtraBold" font-size="19" fill="#032858" text-anchor="middle">2</text><text x="417.5" y="306" font-family="Lufga SemiBold" font-size="17" fill="#032858" text-anchor="middle">Compare</text><text x="417.5" y="336" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="middle">Real profiles, ratings,</text><text x="417.5" y="355" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="middle">portfolios and transparent,</text><text x="417.5" y="374" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="middle">tax-inclusive pricing</text><line x1="526.0" y1="315.0" x2="562.0" y2="315.0" stroke="#7AD91F" stroke-width="2.6" marker-end="url(#ah-7AD91F)"/><rect x="570.0" y="210" width="205" height="210" rx="16" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><circle cx="672.5" cy="254" r="23" fill="#F4FFE4" stroke="#97EF29" stroke-width="2"/><text x="672.5" y="262" font-family="Lufga ExtraBold" font-size="19" fill="#032858" text-anchor="middle">3</text><text x="672.5" y="306" font-family="Lufga SemiBold" font-size="17" fill="#032858" text-anchor="middle">Connect</text><text x="672.5" y="336" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="middle">Chat, call, voice note or</text><text x="672.5" y="355" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="middle">WhatsApp — share contact</text><text x="672.5" y="374" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="middle">details only if you choose</text><line x1="781.0" y1="315.0" x2="817.0" y2="315.0" stroke="#7AD91F" stroke-width="2.6" marker-end="url(#ah-7AD91F)"/><rect x="825.0" y="210" width="205" height="210" rx="16" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><circle cx="927.5" cy="254" r="23" fill="#F4FFE4" stroke="#97EF29" stroke-width="2"/><text x="927.5" y="262" font-family="Lufga ExtraBold" font-size="19" fill="#032858" text-anchor="middle">4</text><text x="927.5" y="306" font-family="Lufga SemiBold" font-size="17" fill="#032858" text-anchor="middle">Book</text><text x="927.5" y="336" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="middle">Live availability,</text><text x="927.5" y="355" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="middle">reminders and free</text><text x="927.5" y="374" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="middle">cancellation until the job</text><line x1="1036.0" y1="315.0" x2="1072.0" y2="315.0" stroke="#7AD91F" stroke-width="2.6" marker-end="url(#ah-7AD91F)"/><rect x="1080.0" y="210" width="205" height="210" rx="16" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><circle cx="1182.5" cy="254" r="23" fill="#F4FFE4" stroke="#97EF29" stroke-width="2"/><text x="1182.5" y="262" font-family="Lufga ExtraBold" font-size="19" fill="#032858" text-anchor="middle">5</text><text x="1182.5" y="306" font-family="Lufga SemiBold" font-size="17" fill="#032858" text-anchor="middle">Pay safely</text><text x="1182.5" y="336" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="middle">Optional online payment,</text><text x="1182.5" y="355" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="middle">held until the job is done;</text><text x="1182.5" y="374" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="middle">refunds if things go wrong</text><line x1="1291.0" y1="315.0" x2="1327.0" y2="315.0" stroke="#7AD91F" stroke-width="2.6" marker-end="url(#ah-7AD91F)"/><rect x="1335.0" y="210" width="205" height="210" rx="16" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><circle cx="1437.5" cy="254" r="23" fill="#F4FFE4" stroke="#97EF29" stroke-width="2"/><text x="1437.5" y="262" font-family="Lufga ExtraBold" font-size="19" fill="#032858" text-anchor="middle">6</text><text x="1437.5" y="306" font-family="Lufga SemiBold" font-size="17" fill="#032858" text-anchor="middle">Review</text><text x="1437.5" y="336" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="middle">Rate the provider —</text><text x="1437.5" y="355" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="middle">photos included — and</text><text x="1437.5" y="374" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="middle">power the next customer</text><rect x="60" y="466" width="1480" height="96" rx="16" fill="#F4FFE4" stroke="#D4F9A0" stroke-width="1.2" /><text x="92" y="506" font-family="Lufga SemiBold" font-size="16" fill="#032858" text-anchor="start">In a hurry, or a complex job?</text><text x="92" y="532" font-family="Lufga" font-size="14" fill="#171717" text-anchor="start">Post one request instead — “Get Quotes” — and let matched providers come to you with bids. (See: How Get Quotes works)</text><line x1="60" y1="654" x2="1540" y2="654" stroke="#E7E7E7" stroke-width="1"/><g transform="translate(60,666) scale(0.4)">
