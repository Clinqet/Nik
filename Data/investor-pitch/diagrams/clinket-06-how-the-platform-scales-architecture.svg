<svg width="1600" height="1060" viewBox="0 0 1600 1060" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah-032858" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#032858"/></marker><marker id="ah-97EF29" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#97EF29"/></marker><marker id="ah-5F5F5F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F5F5F"/></marker><marker id="ah-7AD91F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7AD91F"/></marker><marker id="ah-0869D4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0869D4"/></marker><marker id="ah-9CA3AF" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/></marker><linearGradient id="heroNavy" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#032858"/><stop offset="50%" stop-color="#0A3A6B"/><stop offset="100%" stop-color="#032858"/></linearGradient><linearGradient id="airy" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="40%" stop-color="#F0F4FF"/><stop offset="70%" stop-color="#E8F9FF"/><stop offset="100%" stop-color="#FFFFFF"/></linearGradient><linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#CFEEB0"/><stop offset="100%" stop-color="#97EF29"/></linearGradient></defs><rect width="1600" height="1060" fill="#FFFFFF"/><text x="60" y="78" font-family="Lufga ExtraBold" font-size="34" fill="#032858" text-anchor="start">Platform architecture — enterprise-grade, one-click global</text><rect x="62" y="94" width="70" height="5" rx="2.5" fill="#97EF29"/><text x="60" y="128" font-family="Lufga" font-size="16" fill="#5F5F5F" text-anchor="start">Built cloud-native on Microsoft Azure. Scales from zero to millions automatically; a whole new country goes live in hours.</text><rect x="60.0" y="168" width="359.5" height="56" rx="12" fill="#EAF7FF" stroke="#BFE3F5" stroke-width="1.2" /><text x="239.75" y="202" font-family="Lufga SemiBold" font-size="14.5" fill="#032858" text-anchor="middle">Customer web + mobile</text><line x1="239.75" y1="228" x2="239.75" y2="264" stroke="#5F5F5F" stroke-width="1.8" marker-end="url(#ah-5F5F5F)"/><rect x="433.5" y="168" width="359.5" height="56" rx="12" fill="#EAF7FF" stroke="#BFE3F5" stroke-width="1.2" /><text x="613.25" y="202" font-family="Lufga SemiBold" font-size="14.5" fill="#032858" text-anchor="middle">Provider web + mobile</text><line x1="613.25" y1="228" x2="613.25" y2="264" stroke="#5F5F5F" stroke-width="1.8" marker-end="url(#ah-5F5F5F)"/><rect x="807.0" y="168" width="359.5" height="56" rx="12" fill="#EAF7FF" stroke="#BFE3F5" stroke-width="1.2" /><text x="986.75" y="202" font-family="Lufga SemiBold" font-size="14.5" fill="#032858" text-anchor="middle">Admin console</text><line x1="986.75" y1="228" x2="986.75" y2="264" stroke="#5F5F5F" stroke-width="1.8" marker-end="url(#ah-5F5F5F)"/><rect x="1180.5" y="168" width="359.5" height="56" rx="12" fill="#EAF7FF" stroke="#BFE3F5" stroke-width="1.2" /><text x="1360.25" y="202" font-family="Lufga SemiBold" font-size="14.5" fill="#032858" text-anchor="middle">Phone calls + WhatsApp</text><line x1="1360.25" y1="228" x2="1360.25" y2="264" stroke="#5F5F5F" stroke-width="1.8" marker-end="url(#ah-5F5F5F)"/><rect x="60" y="268" width="1480" height="74" rx="14" fill="url(#heroNavy)" stroke="#032858" stroke-width="0" /><text x="92" y="300" font-family="Lufga SemiBold" font-size="16" fill="#FFFFFF" text-anchor="start">Azure Front Door — the only way in</text><text x="92" y="324" font-family="Lufga" font-size="12.5" fill="#BFD3EA" text-anchor="start">Global edge network · firewall + dynamic rule engine · bot + abuse blocking · geo-filtering · routes each user to the nearest region</text><line x1="800.0" y1="346" x2="800.0" y2="380" stroke="#5F5F5F" stroke-width="1.8" marker-end="url(#ah-5F5F5F)"/><rect x="60" y="384" width="1480" height="500" rx="18" fill="#FAFAFB" stroke="#D1D5DB" stroke-width="1.4" stroke-dasharray="7 5"/><text x="88" y="422" font-family="Lufga SemiBold" font-size="16.5" fill="#032858" text-anchor="start">Regional stamp — the whole platform, replicated per region</text><text x="88" y="446" font-family="Lufga" font-size="12.5" fill="#5F5F5F" text-anchor="start">Live today: Canada/US + India · fully automated deployment — a new region (e.g. Australia) is production-ready in hours, data kept in-country</text><rect x="88" y="470" width="430" height="170" rx="14" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><text x="112" y="504" font-family="Lufga SemiBold" font-size="15" fill="#032858" text-anchor="start">API layer</text><text x="112" y="532" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">Main platform API — auto-scaling</text><text x="112" y="552" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">Identity API — passkeys, biometrics, OTP,</text><text x="112" y="572" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">social logins; modern token security</text><rect x="112" y="596" width="229" height="27" rx="13.5" fill="#F4FFE4" stroke="#D4F9A0" stroke-width="1"/><text x="226.37" y="613.82" font-family="Lufga Medium" font-size="12" fill="#032858" text-anchor="middle">Stateless · scales 0 → millions</text><rect x="542" y="470" width="620" height="170" rx="14" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><text x="566" y="504" font-family="Lufga SemiBold" font-size="15" fill="#032858" text-anchor="start">27+ asynchronous engines (microservices)</text><rect x="566" y="520" width="133" height="26.5" rx="13.25" fill="#F0F4FF" stroke="#D9E2F5" stroke-width="1"/><text x="632.2737500000001" y="537.39" font-family="Lufga Medium" font-size="11.5" fill="#032858" text-anchor="middle">Leads + broadcast</text><rect x="705.5475" y="520" width="107" height="26.5" rx="13.25" fill="#F0F4FF" stroke="#D9E2F5" stroke-width="1"/><text x="759.28625" y="537.39" font-family="Lufga Medium" font-size="11.5" fill="#032858" text-anchor="middle">Notifications</text><rect x="820.025" y="520" width="57" height="26.5" rx="13.25" fill="#F0F4FF" stroke="#D9E2F5" stroke-width="1"/><text x="848.69375" y="537.39" font-family="Lufga Medium" font-size="11.5" fill="#032858" text-anchor="middle">Email</text><rect x="884.3625" y="520" width="76" height="26.5" rx="13.25" fill="#F0F4FF" stroke="#D9E2F5" stroke-width="1"/><text x="922.4325" y="537.39" font-family="Lufga Medium" font-size="11.5" fill="#032858" text-anchor="middle">WhatsApp</text><rect x="967.5024999999999" y="520" width="45" height="26.5" rx="13.25" fill="#F0F4FF" stroke="#D9E2F5" stroke-width="1"/><text x="989.90375" y="537.39" font-family="Lufga Medium" font-size="11.5" fill="#032858" text-anchor="middle">SMS</text><rect x="1019.305" y="520" width="101" height="26.5" rx="13.25" fill="#F0F4FF" stroke="#D9E2F5" stroke-width="1"/><text x="1069.9099999999999" y="537.39" font-family="Lufga Medium" font-size="11.5" fill="#032858" text-anchor="middle">Search index</text><rect x="566" y="552" width="82" height="26.5" rx="13.25" fill="#F0F4FF" stroke="#D9E2F5" stroke-width="1"/><text x="607.20375" y="569.39" font-family="Lufga Medium" font-size="11.5" fill="#032858" text-anchor="middle">Analytics</text><rect x="655.4075" y="552" width="120" height="26.5" rx="13.25" fill="#F0F4FF" stroke="#D9E2F5" stroke-width="1"/><text x="715.41375" y="569.39" font-family="Lufga Medium" font-size="11.5" fill="#032858" text-anchor="middle">Recommendations</text><rect x="782.4200000000001" y="552" width="57" height="26.5" rx="13.25" fill="#F0F4FF" stroke="#D9E2F5" stroke-width="1"/><text x="811.0887500000001" y="569.39" font-family="Lufga Medium" font-size="11.5" fill="#032858" text-anchor="middle">Media</text><rect x="846.7575" y="552" width="76" height="26.5" rx="13.25" fill="#F0F4FF" stroke="#D9E2F5" stroke-width="1"/><text x="884.8275000000001" y="569.39" font-family="Lufga Medium" font-size="11.5" fill="#032858" text-anchor="middle">Voice AI</text><rect x="929.8975" y="552" width="70" height="26.5" rx="13.25" fill="#F0F4FF" stroke="#D9E2F5" stroke-width="1"/><text x="964.83375" y="569.39" font-family="Lufga Medium" font-size="11.5" fill="#032858" text-anchor="middle">Billing</text><rect x="1006.77" y="552" width="82" height="26.5" rx="13.25" fill="#F0F4FF" stroke="#D9E2F5" stroke-width="1"/><text x="1047.9737499999999" y="569.39" font-family="Lufga Medium" font-size="11.5" fill="#032858" text-anchor="middle">Reminders</text><rect x="566" y="584" width="82" height="26.5" rx="13.25" fill="#F0F4FF" stroke="#D9E2F5" stroke-width="1"/><text x="607.20375" y="601.39" font-family="Lufga Medium" font-size="11.5" fill="#032858" text-anchor="middle">Documents</text><rect x="1186" y="470" width="326" height="170" rx="14" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><text x="1210" y="504" font-family="Lufga SemiBold" font-size="15" fill="#032858" text-anchor="start">Service Bus</text><text x="1210" y="532" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">25+ queues decouple</text><text x="1210" y="552" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">everything — nothing</text><text x="1210" y="572" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">blocks a user request,</text><text x="1210" y="592" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">nothing gets lost</text><rect x="88" y="664" width="500" height="150" rx="14" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><text x="112" y="698" font-family="Lufga SemiBold" font-size="15" fill="#032858" text-anchor="start">Data — split by design</text><text x="112" y="726" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">Cosmos DB — all business data, millisecond-fast,</text><text x="112" y="746" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">designed to grow without limits</text><text x="112" y="766" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">SQL — logins + financial records, kept separate</text><rect x="612" y="664" width="520" height="150" rx="14" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><text x="636" y="698" font-family="Lufga SemiBold" font-size="15" fill="#032858" text-anchor="start">Azure AI services</text><text x="636" y="726" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">OpenAI models · AI Search (hybrid + semantic)</text><text x="636" y="746" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">Speech (28 languages) · Document Intelligence</text><text x="636" y="766" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">GPT-Realtime voice · embeddings + enrichment</text><rect x="1156" y="664" width="356" height="150" rx="14" fill="#F4FFE4" stroke="#D4F9A0" stroke-width="1.2" /><text x="1180" y="698" font-family="Lufga SemiBold" font-size="15" fill="#032858" text-anchor="start">Zero-credential security</text><text x="1180" y="726" font-family="Lufga" font-size="13" fill="#171717" text-anchor="start">No usernames or passwords</text><text x="1180" y="746" font-family="Lufga" font-size="13" fill="#171717" text-anchor="start">exist inside the boundary —</text><text x="1180" y="766" font-family="Lufga" font-size="13" fill="#171717" text-anchor="start">managed identity only.</text><text x="1180" y="786" font-family="Lufga" font-size="13" fill="#171717" text-anchor="start">Nothing to steal.</text><rect x="60.0" y="910" width="359.5" height="78" rx="12" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="78.0" y="928" width="4" height="42" rx="2" fill="#97EF29"/><text x="94.0" y="944" font-family="Lufga" font-size="12.5" fill="#171717" text-anchor="start">Runs itself — self-healing, admin alerted</text><text x="94.0" y="962" font-family="Lufga" font-size="12.5" fill="#171717" text-anchor="start">before users notice</text><rect x="433.5" y="910" width="359.5" height="78" rx="12" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="451.5" y="928" width="4" height="42" rx="2" fill="#97EF29"/><text x="467.5" y="944" font-family="Lufga" font-size="12.5" fill="#171717" text-anchor="start">Infrastructure cost at scale: hundreds of</text><text x="467.5" y="962" font-family="Lufga" font-size="12.5" fill="#171717" text-anchor="start">dollars, not millions</text><rect x="807.0" y="910" width="359.5" height="78" rx="12" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="825.0" y="928" width="4" height="42" rx="2" fill="#97EF29"/><text x="841.0" y="944" font-family="Lufga" font-size="12.5" fill="#171717" text-anchor="start">Data residency + privacy law compliance</text><text x="841.0" y="962" font-family="Lufga" font-size="12.5" fill="#171717" text-anchor="start">per region, consent automated</text><rect x="1180.5" y="910" width="359.5" height="78" rx="12" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="1198.5" y="928" width="4" height="42" rx="2" fill="#97EF29"/><text x="1214.5" y="944" font-family="Lufga" font-size="12.5" fill="#171717" text-anchor="start">Apple + Google approved — web, iOS and</text><text x="1214.5" y="962" font-family="Lufga" font-size="12.5" fill="#171717" text-anchor="start">Android, incl. billing</text><line x1="60" y1="1014" x2="1540" y2="1014" stroke="#E7E7E7" stroke-width="1"/><g transform="translate(60,1026) scale(0.4)">
