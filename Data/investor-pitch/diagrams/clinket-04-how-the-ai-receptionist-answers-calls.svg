<svg width="1600" height="810" viewBox="0 0 1600 810" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah-032858" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#032858"/></marker><marker id="ah-97EF29" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#97EF29"/></marker><marker id="ah-5F5F5F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F5F5F"/></marker><marker id="ah-7AD91F" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7AD91F"/></marker><marker id="ah-0869D4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0869D4"/></marker><marker id="ah-9CA3AF" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/></marker><linearGradient id="heroNavy" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#032858"/><stop offset="50%" stop-color="#0A3A6B"/><stop offset="100%" stop-color="#032858"/></linearGradient><linearGradient id="airy" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="40%" stop-color="#F0F4FF"/><stop offset="70%" stop-color="#E8F9FF"/><stop offset="100%" stop-color="#FFFFFF"/></linearGradient><linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#CFEEB0"/><stop offset="100%" stop-color="#97EF29"/></linearGradient></defs><rect width="1600" height="810" fill="#FFFFFF"/><text x="60" y="78" font-family="Lufga ExtraBold" font-size="34" fill="#032858" text-anchor="start">The AI receptionist — every call answered, every action done</text><rect x="62" y="94" width="70" height="5" rx="2.5" fill="#97EF29"/><text x="60" y="128" font-family="Lufga" font-size="16" fill="#5F5F5F" text-anchor="start">A dedicated business line where AI behaves like a trained employee — and the owner stays in control.</text><rect x="60" y="175" width="300" height="118" rx="16" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><text x="90" y="221" font-family="Lufga SemiBold" font-size="17" fill="#032858" text-anchor="start">Customer calls</text><text x="90" y="249" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">the business’s dedicated</text><text x="90" y="268" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">Clinket number</text><line x1="366" y1="234" x2="424" y2="234" stroke="#7AD91F" stroke-width="2.6" marker-end="url(#ah-7AD91F)"/><rect x="430" y="175" width="390" height="118" rx="16" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><text x="460" y="217" font-family="Lufga SemiBold" font-size="17" fill="#032858" text-anchor="start">Rings the owner first</text><text x="460" y="245" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">Missed, declined or after hours —</text><text x="460" y="264" font-family="Lufga" font-size="13" fill="#5F5F5F" text-anchor="start">the AI takes over, seamlessly</text><line x1="826" y1="234" x2="884" y2="234" stroke="#7AD91F" stroke-width="2.6" marker-end="url(#ah-7AD91F)"/><rect x="890" y="175" width="650" height="118" rx="16" fill="url(#heroNavy)" stroke="#032858" stroke-width="0" /><text x="920" y="217" font-family="Lufga SemiBold" font-size="18" fill="#FFFFFF" text-anchor="start">AI answers like a trained employee</text><text x="920" y="245" font-family="Lufga" font-size="13" fill="#BFD3EA" text-anchor="start">It knows the whole business: services, prices, hours, history,</text><text x="920" y="264" font-family="Lufga" font-size="13" fill="#BFD3EA" text-anchor="start">standing instructions — and it can search the web when needed</text><text x="60" y="311" font-family="Lufga" font-size="12" fill="#5F5F5F" text-anchor="start"></text><rect x="60" y="317" width="239" height="28" rx="14.0" fill="#EAF7FF" stroke="#BFE3F5" stroke-width="1"/><text x="179.275" y="335.68" font-family="Lufga Medium" font-size="13" fill="#032858" text-anchor="middle">Owner-first, AI on miss (24/7)</text><rect x="308.55" y="317" width="139" height="28" rx="14.0" fill="#EAF7FF" stroke="#BFE3F5" stroke-width="1"/><text x="378.23" y="335.68" font-family="Lufga Medium" font-size="13" fill="#032858" text-anchor="middle">After-hours only</text><rect x="457.91" y="317" width="189" height="28" rx="14.0" fill="#EAF7FF" stroke="#BFE3F5" stroke-width="1"/><text x="552.3875" y="335.68" font-family="Lufga Medium" font-size="13" fill="#032858" text-anchor="middle">Listen + summarize only</text><rect x="656.865" y="317" width="281" height="28" rx="14.0" fill="#EAF7FF" stroke="#BFE3F5" stroke-width="1"/><text x="797.395" y="335.68" font-family="Lufga Medium" font-size="13" fill="#032858" text-anchor="middle">Private mode — AI fully off the call</text><rect x="947.9250000000001" y="317" width="182" height="28" rx="14.0" fill="#EAF7FF" stroke="#BFE3F5" stroke-width="1"/><text x="1038.8600000000001" y="335.68" font-family="Lufga Medium" font-size="13" fill="#032858" text-anchor="middle">Pause / resume anytime</text><rect x="1139.795" y="317" width="331" height="28" rx="14.0" fill="#EAF7FF" stroke="#BFE3F5" stroke-width="1"/><text x="1305.1225000000002" y="335.68" font-family="Lufga Medium" font-size="13" fill="#032858" text-anchor="middle">Standing instructions: “no pepperoni today”</text><text x="60" y="371" font-family="Lufga SemiBold" font-size="16" fill="#032858" text-anchor="start">While on the call, it actually does the work:</text><rect x="60.0" y="391" width="236" height="168" rx="14" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="60.0" y="391" width="42" height="5" rx="2.5" fill="#97EF29" transform="translate(24,26)"/><text x="84.0" y="445" font-family="Lufga SemiBold" font-size="15" fill="#032858" text-anchor="start">Books + reschedules</text><text x="84.0" y="473.0" font-family="Lufga" font-size="12.3" fill="#5F5F5F" text-anchor="start">Real appointments on the real</text><text x="84.0" y="491.5" font-family="Lufga" font-size="12.3" fill="#5F5F5F" text-anchor="start">calendar; changes confirmed</text><text x="84.0" y="510.0" font-family="Lufga" font-size="12.3" fill="#5F5F5F" text-anchor="start">with a one-time security code</text><rect x="308.8" y="391" width="236" height="168" rx="14" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="308.8" y="391" width="42" height="5" rx="2.5" fill="#97EF29" transform="translate(24,26)"/><text x="332.8" y="445" font-family="Lufga SemiBold" font-size="15" fill="#032858" text-anchor="start">Takes orders + quotes</text><text x="332.8" y="473.0" font-family="Lufga" font-size="12.3" fill="#5F5F5F" text-anchor="start">Creates quotations and</text><text x="332.8" y="491.5" font-family="Lufga" font-size="12.3" fill="#5F5F5F" text-anchor="start">orders live during the</text><text x="332.8" y="510.0" font-family="Lufga" font-size="12.3" fill="#5F5F5F" text-anchor="start">conversation, ready for review</text><rect x="557.6" y="391" width="236" height="168" rx="14" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="557.6" y="391" width="42" height="5" rx="2.5" fill="#97EF29" transform="translate(24,26)"/><text x="581.6" y="445" font-family="Lufga SemiBold" font-size="15" fill="#032858" text-anchor="start">Remembers every caller</text><text x="581.6" y="473.0" font-family="Lufga" font-size="12.3" fill="#5F5F5F" text-anchor="start">Each caller becomes a customer</text><text x="581.6" y="491.5" font-family="Lufga" font-size="12.3" fill="#5F5F5F" text-anchor="start">record — number, email, name —</text><text x="581.6" y="510.0" font-family="Lufga" font-size="12.3" fill="#5F5F5F" text-anchor="start">ready for follow-up</text><rect x="806.4000000000001" y="391" width="236" height="168" rx="14" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="806.4000000000001" y="391" width="42" height="5" rx="2.5" fill="#97EF29" transform="translate(24,26)"/><text x="830.4000000000001" y="445" font-family="Lufga SemiBold" font-size="15" fill="#032858" text-anchor="start">Answers anything</text><text x="830.4000000000001" y="473.0" font-family="Lufga" font-size="12.3" fill="#5F5F5F" text-anchor="start">Services, prices, availability,</text><text x="830.4000000000001" y="491.5" font-family="Lufga" font-size="12.3" fill="#5F5F5F" text-anchor="start">directions — always from the</text><text x="830.4000000000001" y="510.0" font-family="Lufga" font-size="12.3" fill="#5F5F5F" text-anchor="start">business’s own information</text><rect x="1055.2" y="391" width="236" height="168" rx="14" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="1055.2" y="391" width="42" height="5" rx="2.5" fill="#97EF29" transform="translate(24,26)"/><text x="1079.2" y="445" font-family="Lufga SemiBold" font-size="15" fill="#032858" text-anchor="start">Sends follow-ups</text><text x="1079.2" y="473.0" font-family="Lufga" font-size="12.3" fill="#5F5F5F" text-anchor="start">Quotes and confirmations by</text><text x="1079.2" y="491.5" font-family="Lufga" font-size="12.3" fill="#5F5F5F" text-anchor="start">WhatsApp, SMS or email —</text><text x="1079.2" y="510.0" font-family="Lufga" font-size="12.3" fill="#5F5F5F" text-anchor="start">while still on the line</text><rect x="1304.0" y="391" width="236" height="168" rx="14" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="1.2" /><rect x="1304.0" y="391" width="42" height="5" rx="2.5" fill="#97EF29" transform="translate(24,26)"/><text x="1328.0" y="445" font-family="Lufga SemiBold" font-size="15" fill="#032858" text-anchor="start">Hands over smoothly</text><text x="1328.0" y="473.0" font-family="Lufga" font-size="12.3" fill="#5F5F5F" text-anchor="start">Owner watches the live</text><text x="1328.0" y="491.5" font-family="Lufga" font-size="12.3" fill="#5F5F5F" text-anchor="start">transcript and can take over</text><text x="1328.0" y="510.0" font-family="Lufga" font-size="12.3" fill="#5F5F5F" text-anchor="start">mid-call like a colleague</text><rect x="60" y="593" width="734.0" height="128" rx="16" fill="#F4FFE4" stroke="#D4F9A0" stroke-width="1.2" /><text x="92" y="633" font-family="Lufga SemiBold" font-size="16" fill="#032858" text-anchor="start">After every call — the follow-up feed</text><text x="92" y="661" font-family="Lufga" font-size="13.5" fill="#171717" text-anchor="start">Two-line summary, full transcript, recording, and exactly what the AI did</text><text x="92" y="681" font-family="Lufga" font-size="13.5" fill="#171717" text-anchor="start">(booking created, quote sent, customer added) with confidence scores.</text><rect x="806.0" y="593" width="734.0" height="128" rx="16" fill="#F0F4FF" stroke="#D9E2F5" stroke-width="1.2" /><text x="838.0" y="633" font-family="Lufga SemiBold" font-size="16" fill="#032858" text-anchor="start">Fits any business, any size</text><text x="838.0" y="661" font-family="Lufga" font-size="13.5" fill="#171717" text-anchor="start">Pizza shop order line, dental front desk, one-person mechanic, heavy-equipment</text><text x="838.0" y="681" font-family="Lufga" font-size="13.5" fill="#171717" text-anchor="start">sales floor — set up in minutes from flyers, photos or plain instructions.</text><line x1="60" y1="764" x2="1540" y2="764" stroke="#E7E7E7" stroke-width="1"/><g transform="translate(60,776) scale(0.4)">
