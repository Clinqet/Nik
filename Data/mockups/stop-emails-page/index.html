*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#EEF1F5;color:#101010;font-family:"Lufga",system-ui,sans-serif;line-height:1.5;overflow-x:hidden}

/* ================= SHEET (not part of the product) ================= */
.sheet{max-width:1360px;margin:0 auto;padding:28px 16px 80px}
.sheet>header{background:#fff;border:1px solid #E7E7E7;border-radius:20px;padding:24px}
.sheet h1.t{margin:0;font-size:28px;line-height:36px;color:#032858}
.sheet .lead{margin:8px 0 0;max-width:90ch;color:#333;font-size:15px}
.status{display:inline-flex;margin-top:12px;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;background:#FFF4E0;color:#9A5B00;border:1px solid #FFE1B0}
.sheet code{overflow-wrap:anywhere}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.toc a{font-size:13px;font-weight:600;color:#032858;background:#F4FFE4;border:1px solid #CFE8B0;border-radius:999px;padding:6px 12px;text-decoration:none}
.sec{margin-top:40px}
.sec>h2{margin:0;font-size:24px;line-height:32px;color:#032858}
.sec>p.why{margin:6px 0 0;max-width:95ch;color:#333;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;margin-top:20px}
.st{margin-top:32px;padding-top:24px;border-top:1px solid #D9DEE5}
.st h3{margin:0;font-size:18px;line-height:26px;color:#101010}
.st p.why{margin:4px 0 0;color:#5F5F5F;font-size:14px;max-width:95ch}
figure{margin:0;min-width:0;max-width:100%}
figcaption.lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5F5F5F;margin:0 0 8px}
figcaption.cap{font-size:12.5px;line-height:18px;color:#5F5F5F;margin:10px 0 0;max-width:640px}
figcaption.cap b{color:#101010}
.scroller{overflow-x:auto;max-width:100%;padding-bottom:6px}
.dev{background:#fff;border:1px solid #CBD2DB;border-radius:14px;overflow:hidden;box-shadow:0 14px 40px -24px rgba(3,40,88,.45)}
.dev.ph{border:7px solid #101010;border-radius:30px}
.f{container-type:inline-size;container-name:f}
.lap .f{width:1280px}.pad .f{width:820px}.ph .f{width:375px}.w320 .f{width:320px}
.lap .pg{min-height:800px}.pad .pg{min-height:1180px}.ph .pg,.w320 .pg{min-height:812px}
.note{background:#fff;border:1px solid #E7E7E7;border-radius:16px;padding:18px 20px;margin-top:20px;max-width:980px}
.note h4{margin:0 0 6px;font-size:15px;color:#032858}
.note p,.note li{font-size:14px;color:#333;margin:0}
.note ul,.note ol{margin:6px 0 0;padding-left:20px}
.note li{margin:4px 0}
.ask{border-color:#FFE1B0;background:#FFFBF2}
table.tb{border-collapse:collapse;min-width:900px;background:#fff;font-size:13px}
.tb th,.tb td{border:1px solid #E7E7E7;padding:8px 10px;text-align:left;vertical-align:top}
.tb th{background:#F7F8FA;color:#032858;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tb code{font-size:12px;background:#F4F6F8;border-radius:4px;padding:1px 4px}
.new{display:inline-block;font-size:10px;font-weight:700;color:#9A5B00;background:#FFF4E0;border-radius:999px;padding:0 6px;margin-left:4px}
.have{display:inline-block;font-size:10px;font-weight:700;color:#3F7A00;background:#E9F9D6;border-radius:999px;padding:0 6px;margin-left:4px}

/* ================= PROVIDER WEB PAGE (Tailwind classes translated 1:1) =================
   Breakpoints are the app's own (tailwind.config.js: sm 480, md 768, lg 1024, xl 1280), written as
   container queries so each frame below responds to ITS width, exactly as the page responds to a screen. */
.pg{display:flex;flex-direction:column;background:#F5F5F5;color:#101010;font-family:"Lufga",system-ui,sans-serif;line-height:1.5;text-align:left}
.pg p,.pg h1,.pg h2,.pg ul,.pg ol{margin:0}.pg ul,.pg ol{list-style:none;padding:0}
.pg a{text-decoration:none;color:inherit}
.pg button{font-family:inherit;cursor:pointer}
.pg svg.i{flex:none}
.wrap{position:relative;max-width:1152px;margin:0 auto;padding:0 16px}
/* header — about-us/page.jsx */
.hdr{background:#fff;border-bottom:1px solid #E7E7E7}
.hdr .wrap{height:64px;display:flex;align-items:center;justify-content:space-between}
.hdr .home{display:flex;align-items:center;min-height:44px}
.lockup{display:block;height:36px;aspect-ratio:395/123}
.signin{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px;font-weight:600;color:#101010}
/* main — invitation page canvas */
.pg main{position:relative;flex:1;overflow-x:clip}
.pg main.center{display:flex;align-items:center;justify-content:center}
.dots{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle at 1px 1px,rgba(3,40,88,.16) 1px,transparent 0);background-size:26px 26px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 40%,transparent 100%);mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 40%,transparent 100%)}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:20px 0}
.grid>*{min-width:0}
/* footer — landing's full-bleed navy band + legal row; lockup + tagline from SiteFooter.jsx */
.ftr{position:relative;background:#032858;overflow:hidden}
.nd{position:relative;overflow:hidden}
.nd::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(circle at 1.5px 1.5px,#fff 1px,transparent 1.2px);background-size:22px 22px}
.nd>*{position:relative}
.ftr .top{padding-top:32px;padding-bottom:24px}
.ftr .lk{display:block;height:36px;aspect-ratio:395/123;margin-bottom:14px}
.ftr .tag{max-width:360px;font-size:13px;line-height:1.625;color:rgba(255,255,255,.7)}
.ftr .legal{border-top:1px solid rgba(255,255,255,.1)}
.ftr .legal .wrap{padding-top:20px;padding-bottom:20px;display:flex;flex-direction:column-reverse;gap:12px}
.ftr .copy{font-size:12px;color:rgba(255,255,255,.55);text-align:center}
.ftr nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 20px}
.ftr nav a{font-size:12px;color:rgba(255,255,255,.7)}
/* shared pieces */
.card{border-radius:16px;border:1px solid #E7E7E7;background:#fff;box-shadow:0 1px 2px rgba(16,16,16,.04)}
.eb{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#8A8A8A}
.itile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.t-neutral{background:#F5F5F5;color:#5F5F5F}.t-success{background:#E9F9D6;color:#3F7A00}.t-warning{background:#FFF4E0;color:#9A5B00}.t-danger{background:#FDE7E7;color:#B3261E}.t-navy{background:#032858;color:#fff}
.ban{display:flex;gap:10px;align-items:flex-start;border:1px solid;border-radius:12px;padding:12px 14px;font-size:13px;line-height:19px}
.ban svg{margin-top:2px}
.b-success{background:#E9F9D6;color:#3F7A00;border-color:#CDEFA4}.b-warning{background:#FFF4E0;color:#9A5B00;border-color:#FFE1B0}.b-danger{background:#FDE7E7;color:#B3261E;border-color:#F7C6C4}.b-neutral{background:#F5F5F5;color:#5F5F5F;border-color:#E7E7E7}
.otperr{border:1px solid #FF3B30;background:#FFECEC;color:#FF3B30;font-size:14px;line-height:20px;padding:12px 16px;border-radius:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:700;min-height:44px;border:1px solid transparent}
.sec-btn{border-color:#E7E7E7;background:#fff;color:#101010}
.pri-btn{background:#97EF29;color:#101010;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.w100{width:100%}
.pg .cta{display:inline-flex;width:100%;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#101010;background:#97EF29;padding:12px 24px;border-radius:12px;border:0;min-height:48px}
.pg .cta .arrow{margin-left:8px}
.pg .cta.off{background:#E7E7E7;color:#919191;cursor:not-allowed}
.pg .cta.busy{cursor:progress}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.navybtn{margin-top:16px;width:100%;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#032858;color:#fff;font-weight:700;font-size:14px;border-radius:12px;padding:12px 24px;border:0}
/* navy "Before you go" / claim card */
.navy{border-radius:16px;background:#032858;padding:20px;display:flex;flex-direction:column;color:#fff}
.navy .eb{color:rgba(255,255,255,.6)}
.h1n{margin-top:8px!important;font-size:24px;font-weight:700;line-height:1.15;letter-spacing:-.01em;color:#fff}
.subn{margin-top:12px!important;font-size:14px;line-height:23px;color:rgba(255,255,255,.7)}
.pg .wait{margin-top:16px;align-self:flex-start;display:inline-flex;align-items:center;gap:10px;border-radius:12px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);padding:6px 14px 6px 6px;font-size:13px;font-weight:600;color:#fff}
.wait .ico{width:32px;height:32px;border-radius:8px;background:#97EF29;color:#101010;display:grid;place-items:center;flex:none}
.push{margin-top:auto;padding-top:20px}
.steps{margin-top:20px!important;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;counter-reset:s}
.steps li{display:flex;align-items:center;gap:10px;border-radius:12px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);padding:10px 12px;font-size:13px;line-height:18px;font-weight:600;color:#fff}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;background:#97EF29;color:#101010;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}

.noten{margin-top:12px!important;display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:18px;color:rgba(255,255,255,.6)}
.noten b{color:#fff;font-weight:600;overflow-wrap:anywhere}
.codel{font-size:14px;line-height:21px;color:rgba(255,255,255,.85)}
.codel b{color:#fff;overflow-wrap:anywhere}
.otp{display:flex;gap:6px;margin-top:12px}
.otp span{flex:1 1 0;max-width:50px;height:50px;border-radius:8px;background:#F5F5F5;display:grid;place-items:center;font-size:16px;font-weight:700;color:#101010;border:1px solid transparent}
.otp .fo{border-color:#97EF29;box-shadow:0 0 0 2px rgba(151,239,41,.5)}
.otp.err span{border-color:#FF3B30}
.resend{margin-top:12px!important;font-size:12px;color:rgba(255,255,255,.6)}
.resend a{font-weight:600;color:#97EF29;text-decoration:underline;text-underline-offset:3px;display:inline-block;padding:14px 2px;margin:-14px 0}
.resend .dis{font-weight:600;color:rgba(255,255,255,.4)}
/* stop card */
.stop{padding:20px;display:flex;flex-direction:column}
.trow{display:flex;gap:12px;align-items:flex-start}
.h2c{font-size:18px;line-height:26px;font-weight:700;color:#101010}
.bodyc{margin-top:4px!important;font-size:13.5px;line-height:20px;color:#5F5F5F}
.bodyc b{font-weight:600;color:#101010;overflow-wrap:anywhere}
.pg fieldset{border:0;padding:0;margin:16px 0 0;min-width:0}
.pg legend{padding:0;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid #E7E7E7;border-radius:12px;padding:12px 14px;min-height:52px;background:#fff;cursor:pointer}
.opt.on{border-color:#97EF29;background:#F4FFE4}
.radio{margin-top:1px;width:20px;height:20px;border-radius:50%;border:2px solid #BDBDBD;display:grid;place-items:center;flex:none}
.on .radio{border-color:#032858}
.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:#032858}
.opt .t{display:block;font-size:14px;font-weight:600;line-height:20px}
.opt .h{display:block;font-size:12.5px;line-height:18px;color:#5F5F5F;margin-top:2px}
.small{margin-top:12px!important;font-size:12px;line-height:18px;color:#7B7B7B}
.after{margin-top:20px;padding-top:16px;border-top:1px solid #F0F0F0;display:flex;flex-direction:column;gap:8px}
.after p{font-size:12.5px;line-height:18px;color:#5F5F5F}
/* profile preview — OpenPageMock (components/home/mocks.jsx) */
.prev{padding:16px;display:flex;flex-direction:column}
.shell{margin-top:10px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.07),0 24px 70px -30px rgba(3,40,88,.45);overflow:hidden}
.chrome{display:flex;align-items:center;gap:6px;padding:10px 14px;background:#F5F6F4;border-bottom:1px solid #E7E7E7}
.chrome i{width:8px;height:8px;border-radius:50%;background:#E5E7E2;flex:none}
.addr{margin-left:8px;flex:1;min-width:0;height:20px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px #E7E7E7;padding:0 10px;font-size:10.5px;line-height:20px;color:#5F5F5F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover{height:76px;background:#032858}
.pbody{padding:0 16px 16px}
.plogo{position:relative;margin-top:-28px;width:56px;height:56px;border-radius:12px;box-shadow:0 0 0 4px #fff;border:1px solid #E3F7C6;background:#F4FFE4;display:grid;place-items:center;font-size:16px;font-weight:700;color:#032858}
.pname{margin-top:10px!important;font-size:16px;font-weight:700;line-height:22px}
.pmeta{margin-top:4px!important;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:#5F5F5F}
.pmeta span{display:inline-flex;align-items:center;gap:4px}
.svc{margin-top:12px!important;border-top:1px solid #F3F5F0}
.svc li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #F3F5F0}
.svc li:last-child{border-bottom:0;padding-bottom:0}
.svc .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svc .p{flex:none;font-size:13px;font-weight:700}
.svc .r{flex:none;font-size:12px;font-weight:600;color:#5F5F5F}
.prev .sec-btn{margin-top:12px}
/* benefits — landing PILLARS marks in the bento chip */
.ben{padding:16px;display:flex;flex-direction:column}
.ben ul{margin-top:12px!important;display:flex;flex-direction:column;gap:12px;flex:1}
.ben li{display:flex;align-items:center;gap:12px;border:1px solid #E7E7E7;border-radius:16px;padding:12px}
.chip{width:40px;height:40px;border-radius:12px;background:#032858;color:#97EF29;display:grid;place-items:center;flex:none}
.ben .bt{font-size:15px;font-weight:700;line-height:21px}
/* quiet stop link under the claim page */
.quiet{text-align:center;font-size:13px;line-height:20px;color:#5F5F5F;padding:4px 0 28px}
.quiet a{color:#032858;font-weight:600;text-decoration:underline;text-underline-offset:3px;display:inline-block;padding:12px 4px;margin:-12px 0}
/* StateCard — tenancy/primitives.jsx, on the invitation page's centred canvas */
.scw{position:relative;width:100%;padding:40px 16px}
.sc{max-width:560px;margin:0 auto;padding:32px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.sc .big{width:56px;height:56px;border-radius:16px;display:grid;place-items:center}
.sc h1{font-size:18px;font-weight:700;line-height:1.4}
.sc p{max-width:46ch;font-size:13.5px;line-height:20px;color:#5F5F5F}
.sc .acts{margin-top:8px;display:flex;flex-direction:column;gap:8px;width:100%}
.sc .acts .btn{font-size:14px;padding:10px 20px}
.lfp{display:inline-flex;min-height:44px;align-items:center;justify-content:center;gap:8px;border-radius:12px;background:#97EF29;padding:0 20px;font-size:14px;font-weight:600;color:#101010;border:0}
/* skeleton */
.pulse{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
@keyframes pulse{50%{opacity:.5}}
.sk{display:block;border-radius:999px;background:#F0F0F0}
.navy .sk{background:rgba(255,255,255,.15)}
.skb{border-radius:12px;background:#F5F5F5}

@container f (min-width:480px){
  .wrap{padding:0 24px}
  .lockup{height:41px}
  .grid{padding:32px 0}
  .ftr .top{padding-top:40px}
  .ftr .lk{height:42px}
  .ftr .tag{font-size:14px}
  .ftr .legal .wrap{flex-direction:row;align-items:center;justify-content:space-between}
  .ftr .copy{text-align:start}
  .ftr nav{justify-content:flex-end}
  .pg .cta{width:auto}
  .pg .cta.w100{width:100%}
  .navy{padding:28px}
  .pg .wait{font-size:14px}
  .stop{padding:24px}
  .h2c{font-size:20px}
  .prev,.ben{padding:20px}
  .scw{padding:56px 16px}
  .sc{padding:40px 32px}
  .sc h1{font-size:20px}
  .sc p{font-size:14px}
  .sc .acts{flex-direction:row;width:auto;justify-content:center}
}
@container f (min-width:768px){
  .grid{grid-template-columns:repeat(12,minmax(0,1fr));padding:40px 0}
  .h1n{font-size:28px}
  .subn{font-size:15px;line-height:24px}
  .sp .stop{grid-column:1/7;grid-row:1}.sp .byg{grid-column:7/13;grid-row:1}
  .sp .prev{grid-column:1/7;grid-row:2}.sp .ben{grid-column:7/13;grid-row:2}
  .sp .ben li{flex:1}
  .cp .claim{grid-column:1/8;grid-row:1}.cp .prev{grid-column:8/13;grid-row:1}.cp .ben{grid-column:1/13;grid-row:2}
  .cp .ben{flex-direction:row;align-items:center;gap:24px}
  .cp .ben .eb{width:110px;flex:none}
  .cp .ben ul{margin-top:0!important;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
}
@container f (min-width:1024px){
  .steps{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid{gap:24px}
  .navy{padding:32px}
  .prev,.ben{padding:24px}
  .sp .stop{grid-column:1/5}.sp .byg{grid-column:5/9}.sp .prev{grid-column:9/13;grid-row:1}.sp .ben{grid-column:1/13;grid-row:2}
  .sp .ben{flex-direction:row;align-items:center;gap:24px}
  .sp .ben .eb{width:110px;flex:none}
  .sp .ben ul{margin-top:0!important;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .sp .ben li{flex:initial}
}
@container f (min-width:1280px){ .h1n{font-size:30px} }

/* ================= EMAIL (EmailShell.Render output) ================= */
.mc{background:#fff;border:1px solid #CBD2DB;border-radius:14px;overflow:hidden;box-shadow:0 14px 40px -24px rgba(3,40,88,.45);font-family:"Segoe UI",Arial,Helvetica,sans-serif}
.mc.desk{width:980px}
.mc.mob{width:389px;border:7px solid #101010;border-radius:30px}
.mc .bar{padding:16px 22px;border-bottom:1px solid #EEF0F3}
.mc .subj{font-size:19px;font-weight:600;color:#1f1f1f}
.mc .from{display:flex;align-items:center;gap:12px;margin-top:12px}
.mc .av{width:38px;height:38px;border-radius:50%;background:#032858;color:#97EF29;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.mc .who{font-size:13.5px;color:#1f1f1f;line-height:19px;min-width:0}
.mc .who span{color:#6b6b6b}
.mc .tm{margin-left:auto;font-size:12px;color:#6b6b6b;flex:none}
.mc .mtop{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid #EEF0F3;color:#1f1f1f}
.mail{font-family:'Segoe UI',Arial,Helvetica,sans-serif}
.mail table,.mail td,.mail a{font-family:'Segoe UI',Arial,Helvetica,sans-serif}

.mob .mail .facts td{display:block!important;width:auto!important;text-align:left!important}
.hl{outline:2px dashed #97EF29;outline-offset:4px;border-radius:6px}
