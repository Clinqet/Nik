 document.body.innerHTML=`<main class="review"><span class="tag">M10 · Approved · 6 September 2026</span><h1>One conversation. Every question stays in view.</h1><p class="lead">A working layout proposal for Ask Clinket. Keep the familiar landing page and docked ask box; add a continuous conversation, a clear way back, and a new-conversation action. The examples below are illustrative and do not contact an AI or your business.</p><div class="controls"><label>State<select id="state">${Object.entries(cases).map(([k,v])=>`<option value="${k}" ${k==='conversation'?'selected':''}>${v}</option>`).join('')}</select></label><label>Large preview<select id="size"><option value="870">Web · 870 px</option><option value="1024">Web · 1024 px</option><option value="768">iPad · 768 px</option><option value="360">Small phone · 360 px</option><option value="320">Small phone · 320 px</option></select></label><button id="reset">Reset this example</button></div><div class="proofs"><section class="proof wide"><p id="wideLabel">Web · 870 × 780</p><iframe id="web" title="Web product preview" src="?ui=1&state=conversation"></iframe></section><section class="proof phone"><p>Phone · 390 × 780</p><iframe id="phone" title="Phone product preview" src="?ui=1&state=conversation"></iframe></section></div><p class="muted">Try Conversations → a history row; then send a follow-up. New conversation starts with an empty draft. In Dashboard, try the menu, Ask Clinket and close controls repeatedly. Both previews are interactive.</p><details open><summary>Recommended limits — separate reading history from AI context</summary><table><tr><th>Concern</th><th>Current implementation</th><th>Proposed decision</th></tr><tr><td>AI context</td><td>Last six question/answer pairs.</td><td>Keep six initially, with a separate context budget. Earlier references need explicit clarification; a longer visible history does not mean the AI remembers every old detail.</td></tr><tr><td>Readable conversation</td><td>Also trimmed to six pairs. Reopen draws only the last pair.</td><td>Keep up to 50 pairs with an independent serialized-size ceiling; preserve every saved pair and refuse a further question when full. Fifty is a proposed starting setting, not a universal standard.</td></tr><tr><td>Retention</td><td>Seven days after last activity.</td><td>Keep seven days. History entries must explain expiry and distinguish it from a network failure.</td></tr><tr><td>Usage limits</td><td>Six requests/minute per member; 60/day per member; 200/day per business.</td><td>Keep these independent of conversation length. Starting a new conversation never bypasses them.</td></tr><tr><td>Recent conversations</td><td>Eight question rows on this device, deduplicated by question.</td><td>One row per conversation, isolated by member and business. Keep the existing device-local discovery scope; do not imply cross-device history.</td></tr></table></details><details><summary>Rendering and interaction contract</summary><p class="demo-note">Owner-approved UI and API work; implementation is in progress.</p><ul><li>One active question per conversation. A second tap cannot send twice. Drafting while an answer arrives is allowed; Stop is the only send-side action until completion.</li><li>Append a new question and answer without clearing older exchanges. Each answer owns its sources, copy and feedback actions.</li><li>Back and New remain reachable. Leaving an unfinished answer asks whether to stay or stop; a new conversation never silently inherits the old context.</li><li>Follow the latest answer only while the reader is near the bottom. Reading older answers shows a Latest answer control. Respect reduced motion.</li><li>Saved history is text-only with the existing storage contract. Reopened answers must not show dead citation controls or fabricate sources. Persisting full citation metadata is a separate schema decision.</li><li>Web and native mobile must use the same history, limits, error and permission rules. The phone preview establishes layout, not proof of native implementation.</li><li>Drawer and search dialog have one active overlay, immediate close, focus restoration and 44 px controls. The app owns one scroll region; the keyboard keeps the composer reachable.</li></ul></details><details><summary>Copy provenance — all prototype strings</summary><p class="demo-note">English review copy only. Every “Proposed” key below requires localization in all supported languages before integration. Server messages shown here are illustrative; production must render the server’s translated text and use machine codes for actions.</p><table><thead><tr><th>Prototype key</th><th>Displayed wording</th><th>Production source</th></tr></thead><tbody>${Object.entries(copy).map(([key,value])=>`<tr><td><code>${esc(key)}</code></td><td>${esc(value)}</td><td>${['rate','rateBody','daily','dailyBody','permission','permissionBody','error','errorBody','tool','nothing'].includes(key)?'Translated server answer/error; exact mapping must be verified during implementation.':`Proposed screen key: <code>BusinessSearch.Conversation.${esc(key)}</code>. Reuse an existing matching key when available.`}</td></tr>`).join('')}</tbody></table><p class="demo-note">Service names, example questions, answers, booking names and counts are synthetic review data. In production these come from the member, authorized API records or the AI answer. Reviewer headings, state names and explanatory tables are outside the product UI.</p></details></main>`;

 else if(landing){content=`<section class="landing"><h2>${text('landingTitle')}</h2><p>${text('landingBody')}</p>${state==='workspace'?note('workspace','workspaceBody'):''}${state==='noDocs'?`<div class="notice info">${text('noDocs')}</div>`:''}<div class="lanes"><div class="lane"><h3>${text('suggestions')}</h3><button data-action="suggest">Tell me about the Caterpillar 352 ${svg('send')}</button><button data-action="hours">What are our opening hours? ${svg('send')}</button></div><div class="lane"><h3>${text('recent')}</h3>${state==='empty'||!historyVisible?`<p class="muted">${text('firstVisit')}</p>`:recent()}</div></div><p style="font-size:11px;margin-top:20px">${text('recentNote')}</p></section>`}
 else if(waiting){const k=state==='reopenError'?'reopenError':state==='reopening'?'reopening':state;content=`<div class="empty-state">${svg(state==='reopening'?'chat':'bag')}<h2>${text(k)}</h2>${state==='reopening'?'<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>':`<p>${text(k+'Body')}</p>`}${state==='reopenError'?button('retry','retryReopen','chat','primary'):state==='expired'?button('new','new','plus','primary'):state==='permission'?button('back','back','back'):''}</div>`}
 else {let entries=baseExample?exchange(q1,a1,{saved:state==='source'}):'';if(['seventh','long','limit'].includes(state)){const examples=[['What condition is it in?','The listing doesn’t specify its condition. Confirm that with the seller before proceeding.'],['Does the listing include delivery?','Delivery is not described in this listing.'],['Is the price provided?','A price is not provided in the information available here.'],['Can I see the model again?','The listed model is the 2021 Caterpillar 352 · 07.']];for(let i=0;i<(state==='limit'?48:4);i++){const [q,a]=examples[i%examples.length];entries+=exchange(state==='limit'?q+' ('+(i+2)+')':q,a)}}if(baseExample)entries+=exchange(q2,live&&state==='thinking'?'':state==='streaming'?'It’s listed as an excavator for sale…':state==='nothing'?text('nothing'):a2,{busy:live,saved:state==='source'});for(const row of custom)entries+=exchange(row.q,row.a,{busy:!row.a});if(state==='seventh')entries+=exchange('Then what should I ask the seller?','Ask the seller about the machine’s condition, inspection availability and purchase process. The listing does not provide those details.');
 let notice='';if(['stopped','partial','offline','mic','tool','sourceMissing'].includes(state))notice=note(state==='mic'?'micError':state);if(['rate','daily','limit','sizeLimit','save','conflict','error'].includes(state))notice=note(state==='sizeLimit'?'limit':state,(state==='sizeLimit'?'limit':state)+'Body',['limit','sizeLimit'].includes(state)?['new','new','plus','primary']:state==='conflict'?['reload','reload','chat']:state==='error'?['retry','retry','send']:null);content=`<div class="transcript">${entries}${notice}</div>`}
 document.body.innerHTML=`<div class="app"><nav class="rail" aria-label="Main navigation"><div class="brand">Clinket</div>${button('dashboard','dashboard','home',dash?'selected':'')}${button('search','back','search',!dash?'selected':'')}${button('bookings','navInfo','calendar')}${button('services','navInfo','bag')}${button('inbox','navInfo','chat')}<small>Northside Equipment</small></nav><main class="main"><header class="header"><div class="header-title">${button('menu','menu','menu','icon hamburger')}<h1>${text(dash?'dashboard':'title')}</h1></div><div class="header-actions">${button('search','search','search','icon')}${button('notifications','notifications','bell','icon secondary')}<button class="icon" data-action="language" aria-label="${text('language')}">EN</button></div></header><section class="card" aria-label="${text(dash?'dashboard':'title')}">${!dash&&!landing?`<div class="toolbar">${button('back','back','back')}<span class="topic">${esc(baseExample?text('pageTitle'):(custom[0]?.q||text('new')))}</span>${button('new','new','plus')}</div>`:''}<div class="scroll" id="scroll">${content}</div>${state==='long'?button('latest','latest','down','latest'):''}${!dash?`<form class="composer"><div class="composer-inner"><label class="sr-only" for="ask">${text(landing?'ask':'followup')}</label><div class="compose-field"><textarea id="ask" rows="1" maxlength="500" ${['permission','expired','reopening','reopenError'].includes(state)?'disabled':''} placeholder="${text(landing?'ask':'followup')}">${esc(draft||(['offline','conflict','error','keyboard'].includes(state)?'Can you help me write a purchase enquiry?':''))}</textarea>${button('mic','mic','mic','icon')}${button(live?'stop':'send',live?'stop':'send',live?'stop':'send','icon primary')}</div><div class="composer-foot"><span>${blocked?text('draft'):text('verify')}</span><span id="charCount"></span></div></div></form>`:''}</section>${state==='keyboard'?`<div class="keyboard">${text('keyboard')}<div class="keys">${'qwertyuiop'.split('').map(k=>`<span>${k}</span>`).join('')}</div><div class="keys">${'asdfghjkl'.split('').map(k=>`<span>${k}</span>`).join('')}</div><div class="space">${text('space')}</div></div>`:''}</main></div><dialog id="overlay"></dialog>`;
 const field=document.querySelector('#ask'),send=document.querySelector('[data-action="send"]'),mic=document.querySelector('[data-action="mic"]');if(send)send.disabled=blocked||!field.value.trim();if(mic)mic.disabled=blocked||live;if(field){field.oninput=()=>{draft=field.value;field.style.height='auto';field.style.height=Math.min(field.scrollHeight,118)+'px';if(send)send.disabled=blocked||!draft.trim();document.querySelector('#charCount').textContent=draft.length>400?draft.length+'/500':''};field.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!live&&!blocked)submit()}};document.querySelector('form').onsubmit=e=>{e.preventDefault();if(!live&&!blocked)submit()}}
 document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>act(el.dataset.action,el));if(!landing&&!waiting&&state!=='long'&&!dash){const scroll=document.querySelector('#scroll');scroll.scrollTop=scroll.scrollHeight}if(state==='reopening')timer=setTimeout(()=>{state='source';render()},1800);
 }
 function dialog(title,body){const d=document.querySelector('#overlay');focusBefore=document.activeElement;d.innerHTML=`<div class="dialog-head"><h2>${esc(title)}</h2>${button('close','close','close','icon')}</div>${body}`;d.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>act(el.dataset.action,el));d.addEventListener('close',()=>focusBefore?.isConnected&&focusBefore.focus(),{once:true});d.onclick=e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}};d.showModal()}
 function go(next){state=next;if(next==='reopening'){baseExample=true;custom=[]}render()}
 function leave(next){if(live){dialog('Leave this answer?',`<p>This answer is still arriving. You can stay here, or stop it and leave.</p><div class="stack"><button data-action="close">Stay here</button><button data-action="leave:${next}">Stop and leave</button></div>`)}else{if(next==='new'){draft='';custom=[];baseExample=false;next='landing'}go(next)}}
 function submit(value){const field=document.querySelector('#ask'),q=(value||field?.value||'').trim();if(!q||live)return;draft='';custom.push({q,a:''});state='thinking';render();timer=setTimeout(()=>{custom[custom.length-1].a='For a purchase enquiry, ask the seller to confirm availability and arrange an inspection. Booking availability is not provided in the listing.';state='conversation';render()},1400)}
 async function act(action,el){if(action.startsWith('leave:')){draft='';custom=[];baseExample=false;return go(action.split(':')[1]==='new'?'landing':action.split(':')[1])}switch(action){case'back':return leave('landing');case'new':return leave('new');case'dashboard':return leave('dashboard');case'reopen':case'otherHistory':return go('reopening');case'retryReopen':case'reload':return go('reopening');case'close':return document.querySelector('#overlay').close();case'menu':return dialog('Northside Equipment',`<div class="stack">${button('dashboard','dashboard','home')}${button('search','back','search')}${button('bookings','navInfo','calendar')}${button('services','navInfo','bag')}${button('inbox','navInfo','chat')}</div>`);case'search':if(state!=='dashboard'){document.querySelector('#ask')?.focus();return}return dialog(text('title'),`<p>${text('searchHint')}</p><input id="quick" placeholder="${text('ask')}" aria-label="${text('ask')}">${button('send','quickSend','send','primary')}<div class="lane" style="margin-top:24px"><h3>${text('recent')}</h3>${recent()}</div>`);case'quickSend':{const q=document.querySelector('#quick').value.trim();if(q){document.querySelector('#overlay').close();submit(q)}return}case'suggest':return submit('Tell me about the Caterpillar 352');case'hours':return submit('What are our opening hours?');case'send':return submit();case'stop':return go('stopped');case'retry':return submit('Can you help me write a purchase enquiry?');case'latest':document.querySelector('#scroll').scrollTo({top:document.querySelector('#scroll').scrollHeight,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'});return el.remove();case'mic':return dialog(text('mic'),`<p>${text('micError')}</p>`);case'source':return dialog(text('sourceTitle'),`<p>${text('sourceDescription')}</p><p>This is a sample service for design review. The integrated app will open the authorized service record.</p>`);case'copy':{const answer=el.closest('.answer-body').querySelector('p').textContent;try{await navigator.clipboard.writeText(answer);el.innerHTML=svg('check')+text('copied')}catch{dialog(text('copy'),`<p>Select and copy this answer:</p><textarea style="width:100%;min-height:140px">${esc(answer)}</textarea>`)}return}case'feedback':el.innerHTML=svg('check')+text('feedback');return;case'language':return dialog(text('language'),'<p>English is used in this design review. Production copy will use your chosen language.</p>');case'notifications':return dialog(text('notifications'),'<p>No new notifications in this example.</p>');case'navInfo':return dialog('Design review','<p>This sheet demonstrates dashboard entry and conversations. The existing destination page is outside this preview.</p>')}}
 render();
}
