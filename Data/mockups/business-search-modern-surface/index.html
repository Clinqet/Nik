<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ask Clinket — the modern answer surface</title>
<style>
@font-face{font-family:Lufga;src:url('fonts/LufgaRegular.woff');font-weight:400;font-display:swap}
@font-face{font-family:Lufga;src:url('fonts/LufgaSemiBold.woff');font-weight:600;font-display:swap}
:root{
  --ink:#032858; --ink-soft:#1B4C9B;
  --text:#101010; --muted:#5F6672; --faint:#98A0AC;
  --line:#E7E7E7; --hair:#F1F3F7; --page:#F5F5F5; --card:#FFFFFF; --tint:#FBFCFD;
  --green:#97EF29; --green-soft:#F4FFE4; --green-ink:#3A6410; --green-mid:#DFFABD;
  --amber-bg:#FFF7E8; --amber-line:#F1D9A7; --amber-ink:#9A5B00;
  --red-bg:#FCECEA; --red-line:#F2C4C0; --red-ink:#B3261E;
  --blue-bg:#EAF3FF; --blue-line:#CEDDFB; --blue-ink:#1B4C9B;
  --r-xl:20px; --r-lg:16px; --r:12px; --r-sm:9px;
  --sh:0 1px 2px rgba(3,40,88,.05), 0 8px 24px -14px rgba(3,40,88,.16);
  --sh-lift:0 2px 4px rgba(3,40,88,.06), 0 18px 40px -20px rgba(3,40,88,.26);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:Lufga,Arial,Helvetica,sans-serif;font-size:14px;color:var(--text);background:var(--page);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
p{line-height:1.62}
button,input,textarea,select{font:inherit;color:inherit}
svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid #2475C4;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ══ REVIEWER CHROME — never part of the product ══════════════════════════════════════════════ */
.review{max-width:1680px;margin:auto;padding:26px 22px 60px}
.kicker{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--green-ink)}
.review h1{font-size:27px;letter-spacing:-.4px;color:var(--ink);margin:8px 0 10px}
.lede{max-width:920px;color:var(--muted);font-size:14.5px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:22px 0 16px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.controls label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
select,.review button.tool{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font-size:13px;min-height:44px;cursor:pointer}
.frames{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.frame{flex:0 0 auto;max-width:100%}
.frame>figcaption{font-size:11.5px;font-weight:600;color:var(--muted);margin:0 0 8px 2px}
.frame iframe{display:block;width:100%;height:812px;border:1px solid #D8DEE6;border-radius:22px;background:var(--card);box-shadow:var(--sh)}
.frame.wide{width:900px}
.frame.phone{width:390px}
.frame.phone iframe{border-radius:30px}
.hint{color:var(--muted);font-size:12.5px;margin-top:14px;max-width:1000px}
section.doc{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:0;margin-top:18px;box-shadow:var(--sh);overflow:hidden}
section.doc>h2{font-size:15px;color:var(--ink);padding:18px 20px;margin:0;border-bottom:1px solid var(--hair);background:var(--tint)}
section.doc>.body{padding:18px 20px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:none}
code{font-family:var(--mono);font-size:11.5px;background:var(--hair);padding:1px 5px;border-radius:5px;word-break:break-word}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.new{background:var(--green-soft);color:var(--green-ink);border:1px solid var(--green-mid)}
.pill.gap{background:var(--amber-bg);color:var(--amber-ink);border:1px solid var(--amber-line)}
.pill.bug{background:var(--red-bg);color:var(--red-ink);border:1px solid var(--red-line)}
.pill.ok{background:var(--blue-bg);color:var(--blue-ink);border:1px solid var(--blue-line)}
.callout{border-radius:var(--r);padding:12px 14px;font-size:13px;line-height:1.6;margin:0 0 14px}
.callout.amber{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink)}
.callout.blue{background:var(--blue-bg);border:1px solid var(--blue-line);color:var(--blue-ink)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:132px;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;font-size:10.5px}
.sw i{display:block;height:38px}
.sw span{display:block;padding:5px 7px;font-family:var(--mono);color:var(--muted)}
ul.tight{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--muted)}
ul.tight b{color:var(--text)}
@media(max-width:760px){
  .review{padding:16px 12px 40px}
  .frame.wide,.frame.phone{width:100%}
  .frame iframe{height:640px}
}

/* ══ PRODUCT ══════════════════════════════════════════════════════════════════════════════════ */
body.product{background:var(--page);height:100dvh;overflow:hidden}
.shell{height:100%;display:flex;padding:12px;gap:12px}
/* the dashboard rail — present only from 1024, exactly as the live shell */
.rail{width:236px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:16px 10px;display:none;flex-direction:column;gap:4px;box-shadow:var(--sh)}
.rail .logo{font-weight:600;font-size:21px;color:var(--ink);padding:8px 12px 22px;letter-spacing:-.4px}
.rail a{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:var(--r);font-size:13.5px;color:var(--muted);text-decoration:none}
.rail a svg{width:18px;height:18px}
.rail a.on{background:var(--green-soft);color:var(--ink);font-weight:600}
.rail .biz{margin-top:auto;padding:10px 12px;font-size:11.5px;color:var(--faint)}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.topbar{flex:none;height:64px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:0 14px;box-shadow:var(--sh)}
.topbar h1{font-size:18px;color:var(--ink);letter-spacing:-.2px;white-space:nowrap}
.topbar .left,.topbar .right{display:flex;align-items:center;gap:4px}
.icobtn{width:44px;height:44px;display:grid;place-items:center;border:none;background:none;border-radius:50%;color:var(--muted);cursor:pointer}
.icobtn:hover{background:var(--hair);color:var(--ink)}
.burger{display:grid}

/* the one surface */
.surface{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh);overflow:hidden;position:relative}

/* ── the topic bar: back · topic · new ───────────────────────────────────────────────────────── */
.topic{flex:none;display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--hair);
  background:linear-gradient(180deg,#FCFDFE 0%,#FFFFFF 100%)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px 0 6px;border:none;background:none;border-radius:99px;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
/* ‼️ ONE INTERACTION COLOUR for the pair (owner, 2026-09-08 — supersedes this sheet's original grey).
   Back hovered neutral while New hovered green, so two controls in one bar read as two different systems.
   The hierarchy still holds: New is the bordered, deliberate one. */
.back:hover{background:var(--green-soft);color:var(--green-ink)}
.back:active{background:var(--green-mid)}
.back svg{width:17px;height:17px;stroke-width:2}
.topic .name{flex:1;min-width:0;text-align:center;padding:0 4px}
.topic .name b{display:block;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic .name small{display:block;font-size:11px;color:var(--faint);margin-top:1px}
.newbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:99px;color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.newbtn:hover{border-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
.newbtn:active{background:var(--green-mid)}
.newbtn svg{width:15px;height:15px;stroke-width:2.2}

/* ── the scroller ───────────────────────────────────────────────────────────────────────────── */
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;scrollbar-gutter:stable}
.scroll::-webkit-scrollbar{width:5px;height:5px}
.scroll::-webkit-scrollbar-thumb{background:#C9D2DE;border-radius:9px}
/* ‼️ The COLUMN widens on a laptop; the PARAGRAPH does not. Bounded at 780 everywhere, a 1440 screen left
   ~330px of white down each side of the surface. Widening the column uses it; capping the answer's own
   paragraph at 72 characters keeps the line length a person can actually read, which is the whole reason
   the bound existed. Everything that is not prose — the source cards, a table, the picture strip — takes
   the full width and gains a third column. */
.inner{max-width:780px;margin:auto;padding:22px 22px 8px;display:flex;flex-direction:column}
.inner.bottom{min-height:100%;justify-content:flex-end}

/* ── the transcript ─────────────────────────────────────────────────────────────────────────── */
.turn{display:flex;flex-direction:column;gap:14px;margin-bottom:26px}
.turn:last-child{margin-bottom:6px}
.q{align-self:flex-end;max-width:86%;padding:11px 15px;font-size:14px;line-height:1.55;color:var(--ink);
  background:linear-gradient(180deg,#F7F9FB 0%,#F1F4F8 100%);border:1px solid #E8EDF3;
  border-radius:var(--r-lg) var(--r-lg) 5px var(--r-lg);box-shadow:0 1px 1px rgba(3,40,88,.03)}
.a{display:flex;gap:11px;align-items:flex-start}
.mark{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:10px;
  background:linear-gradient(145deg,#F4FFE4 0%,#E4FBC6 100%);border:1px solid var(--green-mid);color:var(--green-ink)}
.mark svg{width:16px;height:16px;stroke-width:1.6}
.abody{flex:1;min-width:0}
.who{font-size:11.5px;font-weight:600;color:var(--ink);margin:5px 0 8px;letter-spacing:.01em}
.abody p{font-size:14.5px;line-height:1.68;color:var(--text)}
.abody p+p{margin-top:10px}
.cite{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;margin:0 1px;
  vertical-align:1px;font-size:10.5px;font-weight:600;color:var(--green-ink);background:var(--green-soft);
  border:1px solid var(--green-mid);border-radius:5px;cursor:pointer}

/* the live step */
.step{display:inline-flex;align-items:center;gap:9px;margin:2px 0 4px;padding:6px 13px 6px 10px;border:1px solid var(--line);
  background:var(--tint);border-radius:99px;font-size:12.5px;color:var(--muted)}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid var(--green-mid);border-top-color:var(--green-ink);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.caret{display:inline-block;width:7px;height:15px;vertical-align:-2px;margin-left:2px;background:var(--green-ink);border-radius:2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}

/* the answer's own controls */
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:12px;padding-top:9px;border-top:1px solid var(--hair)}
.act{display:inline-flex;align-items:center;gap:5px;position:relative;padding:3px 9px;border:1px solid var(--line);background:var(--card);
  border-radius:99px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .16s,border-color .16s,color .16s}
.act::before{content:"";position:absolute;left:0;right:0;top:-11px;bottom:-11px}
.act svg{width:14px;height:14px}
.act:hover{border-color:#C6D2E2;color:var(--ink)}
.act.done{background:var(--green);border-color:var(--green);color:#10240A}
.act.done:hover{background:var(--green);border-color:var(--green);color:#10240A}
.act[disabled]{cursor:default;opacity:1}
.from{margin-left:auto;padding-left:8px;font-size:11.5px;color:var(--faint);white-space:nowrap}

/* ── sources: FOLDED by default ─────────────────────────────────────────────────────────────── */
.src{margin-top:13px;border:1px solid var(--line);border-radius:var(--r);background:var(--tint);overflow:hidden}
.src>summary{display:flex;align-items:center;gap:9px;min-height:44px;padding:0 13px;cursor:pointer;list-style:none;
  font-size:12.5px;font-weight:600;color:var(--ink)}
.src>summary::-webkit-details-marker{display:none}
.src>summary .chev{margin-left:auto;color:var(--faint);transition:transform .18s}
.src>summary .chev svg{width:16px;height:16px}
.src[open]>summary{border-bottom:1px solid var(--hair);background:var(--card)}
.src[open]>summary .chev{transform:rotate(180deg)}
.src>summary em{font-style:normal;font-weight:400;color:var(--faint);font-size:11.5px}
.srcgrid{padding:11px;display:grid;gap:9px;background:var(--card)}
.card{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;background:var(--card)}
.card .kind{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.card strong{display:block;font-size:13px;color:var(--ink);line-height:1.35}
.card .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.card .quote{margin-top:8px;padding:7px 9px;border-left:2px solid var(--green-mid);background:var(--green-soft);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:11.5px;line-height:1.55;color:var(--muted)}
/* 36px of paint, 44 of hit area — the same trick the answer's own controls use, so a row of source cards
   is not made taller by a rule about thumbs. */
.card .go{position:relative;margin-top:9px;display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 11px;border:1px solid var(--line);background:var(--card);border-radius:99px;font-size:11.5px;font-weight:600;color:var(--ink);cursor:pointer}
.card .go::before{content:"";position:absolute;left:0;right:0;top:-4px;bottom:-4px}
.card .go:hover{border-color:var(--green);background:var(--green-soft)}
.card .go svg{width:13px;height:13px}

/* ── boxes ──────────────────────────────────────────────────────────────────────────────────── */
.box{border-radius:var(--r);padding:12px 14px;font-size:13px;line-height:1.6;margin:12px 0}
.box b{display:block;font-weight:600;margin-bottom:2px}
.box.amber{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink)}
.box.red{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red-ink)}
.box.blue{background:var(--blue-bg);border:1px solid var(--blue-line);color:var(--blue-ink)}
.box.calm{background:var(--tint);border:1px solid var(--line);border-left:3px solid var(--green);color:var(--muted)}
.box .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:99px;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn.go{background:var(--green);border-color:var(--green);color:#10240A}
.btn.ghost{background:transparent;border-color:currentColor}

/* ── the landing ────────────────────────────────────────────────────────────────────────────── */
.landing{display:flex;flex-direction:column;gap:16px}
.landing>p.body{font-size:13.5px;color:var(--muted);max-width:64ch}
.lanes{display:grid;gap:16px}
.lane h4{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
.chip{display:block;width:100%;text-align:left;min-height:44px;margin-bottom:7px;padding:8px 12px;border:1px solid var(--line);
  background:var(--card);border-radius:var(--r);font-size:12.5px;line-height:1.4;color:var(--text);cursor:pointer;
  transition:border-color .16s,background .16s,transform .16s}
.chip:hover{border-color:var(--green);background:var(--green-soft);transform:translateY(-1px)}
.rec{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:7px 4px;border:none;background:none;text-align:left;cursor:pointer;border-bottom:1px solid var(--hair)}
.rec:last-child{border-bottom:none}
.rec .dot{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--hair);color:var(--faint)}
.rec .dot svg{width:14px;height:14px}
.rec .txt{min-width:0;flex:1}
.rec .txt b{display:block;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .txt small{display:block;font-size:11px;color:var(--faint);margin-top:1px}
.rec:hover .txt b{color:var(--green-ink)}
.foot-note{font-size:11px;color:var(--faint);margin-top:4px}

/* ── the docked composer ────────────────────────────────────────────────────────────────────── */
.dock{flex:none;border-top:1px solid var(--hair);background:var(--card);padding:12px 16px max(12px,env(safe-area-inset-bottom))}
.dock-in{max-width:780px;margin:auto}
.pill-field{display:flex;align-items:flex-end;gap:7px;padding:6px 6px 6px 14px;border:1px solid var(--line);background:var(--page);
  border-radius:26px;transition:border-color .18s,background .18s,box-shadow .18s}
.pill-field:focus-within{border-color:var(--green);background:var(--card);box-shadow:0 0 0 4px rgba(151,239,41,.16)}
.pill-field.hot{border-color:var(--green);background:var(--green-soft);box-shadow:0 0 0 4px rgba(151,239,41,.14)}
.pill-field.dim{opacity:.6}
.pill-field textarea{flex:1;min-width:0;border:none;background:none;outline:none;resize:none;font-size:16px;line-height:1.45;
  color:var(--text);padding:11px 0;max-height:120px}
.pill-field textarea::placeholder{color:var(--faint)}
.circ{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;position:relative}
.circ:hover{border-color:#C6D2E2;color:var(--ink)}
.circ.go{background:var(--green);border-color:var(--green);color:#10240A}
.circ.off{color:#C9C9C9;cursor:not-allowed}
.circ.rec{border-color:var(--green);background:var(--green);color:#10240A}
.circ.rec::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(151,239,41,.55);animation:halo 1.6s ease-out infinite}
@keyframes halo{0%{transform:scale(.86);opacity:.85}100%{transform:scale(1.18);opacity:0}}
.dockfoot{display:flex;gap:12px;justify-content:space-between;align-items:baseline;padding:8px 4px 0;font-size:11px;color:var(--faint)}
.dockfoot .count{font-family:var(--mono)}
.dockfoot .count.near{color:var(--amber-ink);font-weight:600}

/* the level meter — replaces the field while listening (M3) */
.meter{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:11px 2px}
.bars{display:flex;align-items:center;gap:3px;height:20px;flex:1;min-width:0;overflow:hidden}
.bars i{width:3px;flex:none;border-radius:2px;background:var(--green-ink);height:6px;animation:lv 1.1s ease-in-out infinite}
@keyframes lv{0%,100%{height:5px;opacity:.55}50%{height:19px;opacity:1}}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.clock b{color:var(--ink);font-weight:600}
.clock.near{color:var(--amber-ink)}
.vstrip{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:9px;padding:8px 12px;border-radius:var(--r);font-size:12px;line-height:1.5}
.vstrip.say{background:var(--blue-bg);border:1px solid var(--blue-line);color:var(--blue-ink)}
.vstrip.warn{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber-ink)}
.vstrip.bad{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red-ink)}
.vstrip.calm{background:var(--tint);border:1px solid var(--line);color:var(--muted)}
.vstrip a{margin-left:auto;font-weight:600;text-decoration:underline;cursor:pointer;color:inherit;min-height:28px;display:inline-flex;align-items:center}
.langs{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--muted)}
/* 32px of paint so three languages fit one line under a phone's ask box; 44 of hit area from the band. */
.langs button{position:relative;padding:4px 11px;min-height:32px;border:1px solid var(--line);background:var(--card);border-radius:99px;font-size:11.5px;cursor:pointer}
.langs button::before{content:"";position:absolute;left:0;right:0;top:-6px;bottom:-6px}
.langs button.on{background:var(--green);border-color:var(--green);color:#10240A;font-weight:600}

/* the more-below cue */
.cue{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:44px;height:44px;display:grid;place-items:center;
  border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--green-ink);box-shadow:var(--sh-lift);cursor:pointer;z-index:3}
.cue.live{box-shadow:var(--sh-lift),0 0 0 5px rgba(151,239,41,.25)}
.cue .nd{position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;background:var(--green);border:1.5px solid var(--card)}
.fade{position:absolute;left:0;right:0;bottom:0;height:52px;pointer-events:none;background:linear-gradient(to top,var(--card) 12%,rgba(255,255,255,.72) 55%,transparent);z-index:2}

/* the phone keyboard stand-in */
.kbd{flex:none;height:212px;background:#D9DDE2;border-top:1px solid #BBC3CB;padding:14px 8px;text-align:center;font-size:11px;color:#5A6572}
.kbd .krow{display:flex;justify-content:center;gap:4px;margin:9px 0}
.kbd span{background:#fff;border-radius:5px;padding:9px 0;width:9%;box-shadow:0 1px 1px #8190A0;font-size:11.5px}
.kbd .space{background:#fff;border-radius:7px;padding:11px;margin:10px 60px}

/* narrow: the rail goes, the topic name goes, gutters tighten */
@media(min-width:1024px){.rail{display:flex}.burger{display:none}}
@media(max-width:1023px){.shell{padding:10px;gap:10px}}
@media(max-width:767px){
  .shell{padding:8px;gap:8px}
  .topbar{height:58px;padding:0 8px}
  .topbar h1{font-size:16px}
  .topbar .right .opt{display:none}
  .surface{border-radius:var(--r-lg)}
  .inner{padding:16px 14px 6px}
  .topic{padding:6px 6px}
  .topic .name b{font-size:12.5px}
  .q{max-width:92%;font-size:13.5px}
  .abody p{font-size:14px}
  .mark{width:26px;height:26px;border-radius:9px}
  .dock{padding:10px 12px max(10px,env(safe-area-inset-bottom))}
  .srcgrid{grid-template-columns:1fr}
}
@media(min-width:768px){.srcgrid{grid-template-columns:1fr 1fr}.lanes.two{grid-template-columns:1fr 1fr;gap:26px}}
@media(min-width:1024px){.lanes.two{grid-template-columns:1fr 1fr;gap:30px}}
/* ── the laptop’s own width ─────────────────────────────────────────────────────────────────── */
@media(min-width:1280px){
  .inner{max-width:1100px;padding:26px 34px 10px}
  .dock-in{max-width:1100px}
  .abody p{max-width:72ch}
  /* ‼️ auto-fit on a 1fr track, not a fixed three. Three fixed tracks left a visibly empty third slot
     whenever an answer cited two documents — the commonest case — so the cards spread to fill instead.
     ‼️ The ceiling belongs on the CARD, not on the track: a `minmax(300px,520px)` track is measured from
     its MAX, so at a 989px grid the browser fitted exactly one column and stacked them. */
  .srcgrid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .srcgrid>.card{max-width:560px}
  .q{max-width:72%}
}
@media(min-width:1600px){
  .inner{max-width:1360px;padding:28px 44px 10px}
  .dock-in{max-width:1360px}
  .q{max-width:64%}
}
/* ‼️ The words of New conversation survive as far down as they FIT — measured, that is 520. Dropped at 767
   they were being hidden on a small tablet with 250px to spare, leaving a bare plus that says nothing. */
@media(max-width:520px){
  .newbtn span{display:none}
  .newbtn{padding:0;width:44px;justify-content:center}
}
/* ‼️ 400 and under: the name takes a line of its own. Squeezed between the two controls it had 175px at
   390 — about twenty characters — so a name of any length arrived already cut. A second row costs 20px of
   height; a heading nobody can read costs the whole point of having one. */
@media(max-width:400px){
  .topic{flex-wrap:wrap;row-gap:2px}

  .newbtn{margin-left:auto}

}
/* the folded cover screen */
@media(max-width:330px){
  .q{max-width:96%}
  .clock{font-size:11px}
  .bars{gap:2px}
}

        <li><b>Elevation</b> one shadow, tinted navy rather than black: <code>0 1px 2px rgba(3,40,88,.05), 0 8px 24px -14px rgba(3,40,88,.16)</code>.</li>
        <li><b>Motion</b> 160–180&nbsp;ms on colour and border; the level meter, the caret and the halo are the
          only loops, and every one of them stops under <code>prefers-reduced-motion</code>.</li>
        <li><b>Touch</b> every control is at least 44&nbsp;px of hit area. The feedback chips paint at 20&nbsp;px and
          take their 44 from an invisible band above and below, so a row of controls is not three times the
          height of the text it belongs to.</li>
      </ul>
    </div>
  </section>

  <section class="doc">
    <h2>3 · How a conversation gets its name — decided on cost, and the owner’s call</h2>
    <div class="body">
      <p class="callout blue">
        <b>The approved sheet does not settle this.</b> M10 draws the name “Excavator purchase enquiry”
        above a conversation that opens “Do we have a Caterpillar 352 for sale?”, and its own copy table
        lists that name as prototype data. Today both apps use the first question, cut to one line. Three
        ways to do better, priced on the live rates in <code>AIService:TokenPricing</code>
        (luna: $0.20 / 1M in, $1.20 / 1M out).
      </p>
      <table>
        <thead><tr><th>Option</th><th>How</th><th>Cost per conversation</th><th>Against it</th></tr></thead>
        <tbody>
          <tr><td><b>A</b> · leave it</td><td>The first question, cut to one line. What ships today.</td>
            <td>nothing</td>
            <td>“How much does a Deluxe Hydrafacial with dermaplaning cost for a first-time…” is unreadable
              before it is useful, and two conversations that open similarly are indistinguishable in the list.</td></tr>
          <tr><td><b>B</b> · one small call, off the critical path <span class="pill ok">recommended</span></td>
            <td>On the <b>first turn only</b>, the server asks luna for a name of at most five words in the
              question’s own language, <b>at the same moment</b> the answer starts streaming — it needs only
              the question. It is awaited just before the turn is saved, so it rides the write that was
              already happening.</td>
            <td><b>≈ $0.00003</b><br><span style="color:#98A0AC">≈ 3¢ per 1,000 conversations; about 2% of one
              answer, once per conversation and never per follow-up</span></td>
            <td>One more thing that can fail — so it is bounded by a timeout and, when it does not arrive,
              the name is simply the first question. Needs one key on the conversation record (§4).</td></tr>
          <tr><td><b>C</b> · fold it into the answer</td><td>Ask the answering model to print the name first
              and strip it off the stream.</td>
            <td>≈ $0.000015</td>
            <td>Half the cost of B and the wrong trade: the server would have to hold back the first words to
              cut the name off them, which pushes out time-to-first-word — a number the platform measures —
              and it edits the answer prompt the cost-and-quality programme locked.</td></tr>
          <tr><td><b>D</b> · strip the question by rule</td><td>Drop a leading “do we have”, “how much is”…
              and title-case what is left.</td><td>nothing</td>
            <td>Needs a hand-written list of openings per language. It produces nothing usable in Gujarati or
              Hindi, and inventing that list is exactly the kind of screen-side wording §0.20 forbids.</td></tr>
        </tbody>
      </table>
      <p class="callout amber" style="margin-top:14px">
        <b>The ladder, whichever option is chosen.</b> The bar shows the <b>name</b> when there is one; the
        <b>first question, clamped</b> when there is not (a conversation saved before this shipped, a name
        that timed out, an answer that failed); and <b>New conversation</b> when nothing has been asked.
        A name is written <b>once</b> and never rewritten by a follow-up — a heading that moves while you
        read is worse than a plain one. States <code>titlePending</code>, <code>titleLong</code> and
        <code>titleScript</code> draw all three.
      </p>
    </div>
  </section>

  <section class="doc">
    <h2>4 · What this needs from the server — the §0.7 table</h2>
    <div class="body">
      <p class="callout amber"><b>Nothing below is written until the owner says yes.</b> There is no new
      container, no partition-key change, no index change and no new SQL.</p>
      <table>
        <thead><tr><th>Item</th><th>Detail</th></tr></thead>
        <tbody>
          <tr><th>What</th><td>A <code>topic</code> key inside the conversation record’s <b>existing</b>
            <code>metadata</code> dictionary on <code>AiSession</code> — the same dictionary that already
            carries <code>membershipId</code>. A string, capped at 60 characters. <b>Not</b> a new field on
            the entity and <b>not</b> a new document.</td></tr>
          <tr><th>Who writes it</th><td><code>BusinessSearchController.Ask</code> on turn one only, passed
            into the existing <code>PersistTurnAsync</code> → <code>AppendTurnsAsync</code> create. One
            write, the one that already happens.</td></tr>
          <tr><th>Who reads it</th><td><code>GET business-search/sessions/{id}</code> (so a reopened
            conversation is named) and the <code>Done</code> frame of the first answer (so a live one is
            named as soon as it finishes). Both are read <b>in this change</b> by the provider web app and
            the provider phone app — not by a later phase.</td></tr>
          <tr><th>Why not a column</th><td>Not a table at all — one string, one-to-one with a conversation
            that already exists.</td></tr>
          <tr><th>Why not a constant or an enum</th><td>It is the provider’s own subject, in their own
            language. There is no fixed set.</td></tr>

            it is what happens when no topic is present.</td></tr>
          <tr><th>Cost</th><td>Cosmos: <b>zero extra RU</b> — it rides the create that already occurs; about
            60 more bytes in a document whose cap is 1&nbsp;MB. Model: ≈ $0.00003 once per conversation.
            Latency: <b>zero</b> — the call runs beside the answer, not after it.</td></tr>
          <tr><th>What breaks if it is left out</th><td>Nothing breaks. The bar and the list both fall back
            to the first question, which is what ships today — so this row is genuinely the owner’s call, and
            every other change in this sheet is independent of it.</td></tr>
        </tbody>
      </table>
      <table style="margin-top:16px">
        <thead><tr><th>Also on the wire</th><th>Detail</th></tr></thead>
        <tbody>
          <tr><td><code>BusinessSearchFrameDto.Title</code></td><td>One more optional string, written only on
            the <code>Done</code> frame of a first turn, beside the <code>Conversation</code> and
            <code>Rows</code> it already carries. No new frame kind.</td></tr>
          <tr><td><code>BusinessSearchSessionDto.Title</code></td><td>The same string on the reopen read.</td></tr>
          <tr><td>The device list</td><td><code>recentQuestions</code> keeps <code>{question, sessionId, at}</code>

          <tr><td><code>BusinessSearch:Answer:TopicPrompt</code>,
            <code>…:TopicMaxWords</code>, <code>…:TopicTimeoutMs</code>, <code>…:TopicEnabled</code></td>
            <td>Settings, with class defaults mirroring <code>appsettings.json</code> exactly. Switched off,
            the surface behaves exactly as option A — which is how this ships if the owner prefers A.</td></tr>
        </tbody>
      </table>
    </div>
  </section>

else {

      </div>
    </div>`;

  const cite = (n) => `<span class="cite" data-do="noop">${n}</span>`;
  const turn = (q, a) => `<article class="turn"><div class="q">${esc(q)}</div>${a}</article>`;

  const transcript = () => {
    let out = '';
    if (!showBase) {
      asked.forEach((q, i) => {
        out += turn(q, answer('For a purchase enquiry, ask the seller to confirm availability and arrange an inspection. Booking availability is not set on this listing' + cite(2) + '.', { done: true, ix: i }));
      });
      return out;
    }
    const first = turn(T.q1, answer(T.a1 + cite(1) + T.a1b, { done: true, ix: 0 }));
    if (is('thinking')) { return turn(T.q1, answer('', { step: true })); }
    if (is('streaming')) {
      return first + turn(T.q2, answer(T.a2 + '<span class="caret"></span>', { step: false }));
    }
    if (is('cutShort')) {
      return first + turn(T.q2, answer(T.a2partial, { partialNote: true, done: true, ix: 1 }));
    }
    if (is('long')) {
      out = first;
      for (let i = 0; i < 5; i += 1) {
        out += turn(
          ['What condition is it in?','Does the listing include delivery?','Is the price provided?',
           'Can I see the model again?','What should I ask the seller?'][i],
          answer(['The listing does not state its condition' + cite(1) + '. Confirm that with the seller before proceeding.',
                  'Delivery is not described in this listing' + cite(1) + '.',
                  'The asking price is $268,000' + cite(1) + ', shown as negotiable.',
                  'The listed model is the 2021 Caterpillar 352 · 07' + cite(2) + '.',
                  'Ask about the machine’s condition, whether an inspection can be arranged, and how they want to handle the purchase. The listing does not cover those.'][i],
                 { done: true, ix: i + 1 }),
        );
      }
      return out;
    }
    out = first + turn(T.q2, answer(T.a2 + cite(2) + T.a2b, { done: true, ix: 1 }));
    asked.forEach((q, i) => {
      out += turn(q, answer('For a purchase enquiry, ask the seller to confirm availability and arrange an inspection. Booking availability is not set on this listing' + cite(2) + '.', { done: true, ix: i + 2 }));
    });
    return out;
  };

  const notices = () => {
    if (is('resume')) {
      return `<div class="box amber" role="alert"><b>${T.resumeTitle}</b>${T.resumeBody}
        <div class="row"><button class="btn go" type="button" data-do="noop">${T.resumeOpen}</button>
        <button class="btn" type="button" data-do="new">${T.resumeNew}</button></div></div>`;
    }
    if (is('limit')) {
      return `<div class="box amber" role="alert">${T.dailyLimit}<p style="margin-top:6px">${T.retryIn}</p></div>`;
    }
    if (is('errorState')) {
      return `<div class="box red" role="alert">${T.errText}
        <div class="row"><button class="btn ghost" type="button" data-do="noop">${T.tryAgain}</button></div></div>`;
    }
    if (is('full')) {
      return `<div class="box amber" role="status">${T.fullText}
        <div class="row"><button class="btn go" type="button" data-do="new">${T.newChat}</button></div></div>`;
    }
    return '';
  };

  const landingBlock = () => {
    const rows = is('firstVisit') ? '' : `
      <button class="rec" type="button" data-do="reopen"><span class="dot">${ic('clock')}</span>
        <span class="txt"><b>${T.recent1}</b><small>${T.recent1sub}</small></span>${ic('back')}</button>
      <button class="rec" type="button" data-do="reopen"><span class="dot">${ic('clock')}</span>
        <span class="txt"><b>${T.recent2}</b><small>${T.recent2sub}</small></span>${ic('back')}</button>
      <button class="rec" type="button" data-do="reopen"><span class="dot">${ic('clock')}</span>
        <span class="txt"><b>${T.recent3}</b><small>${T.recent3sub}</small></span>${ic('back')}</button>`;
    const both = !is('firstVisit');
    return `<section class="landing">
      <p class="body">${T.landingBody}</p>
      ${is('noDocs') ? `<div class="box calm"><b>${T.noDocsTitle}</b>${T.noDocsBody}
        <div class="row"><button class="btn go" type="button" data-do="noop">${T.goKnowledge}</button></div></div>` : ''}
      <div class="lanes${both ? ' two' : ''}">
        <div class="lane"><h4>${T.tryAsking}</h4>
          ${[T.chip1,T.chip2,T.chip3,T.chip4].map(c=>`<button class="chip" type="button" data-do="ask" data-q="${esc(c)}">${esc(c)}</button>`).join('')}
        </div>
        <div class="lane"><h4>${T.recent}</h4>
          ${rows || `<p style="font-size:12.5px;color:#98A0AC">${T.firstVisit}</p>`}
        </div>
      </div>
      <p class="foot-note">${T.recentNote}</p>
    </section>`;
  };

  /* the conversation's name — the ladder from §3, and the count is what the transcript actually holds */
  const topicName = () => {
    const base = showBase ? 2 : 0;
    if (is('titlePending')) { return { name: T.q1, turns: 1 }; }
    if (is('titleLong')) { return { name: T.topicLong, turns: 4 }; }
    if (is('titleScript')) { return { name: T.topicGu, turns: 2 }; }
    if (is('long')) { return { name: T.topic, turns: 6 }; }
    if (is('thinking')) { return { name: T.q1, turns: 1 }; }
    // ‼️ No name yet ⇒ the member's own first question, which is the fallback the whole ladder rests on.
    if (!sentTitle && !showBase) { return { name: asked[0] || T.newChat, turns: asked.length }; }
    return { name: sentTitle || T.topic, turns: base + asked.length };
  };

  const composer = () => {
    const listening = voice === 'listening' || voice === 'nearCap';
    const busy = listening || voice === 'transcribing';
    const canSend = draft.trim().length > 0 && !blocked() && !busy;
    const field = listening
      ? `<div class="meter">
           <div class="bars">${Array.from({length:22},(_,i)=>`<i style="animation-delay:${(i*0.07).toFixed(2)}s"></i>`).join('')}</div>
           <div class="clock${voice==='nearCap'?' near':''}"><b>${mm(clock)}</b> / 1:00</div>
         </div>`
      : `<textarea rows="1" maxlength="500" placeholder="${esc(landing() ? T.ask : T.followUp)}"
           ${blocked() ? 'disabled' : ''} aria-label="${esc(landing() ? T.ask : T.followUp)}">${esc(draft)}</textarea>`;

    const micBtn = voice === 'blocked' || voice === 'offline'
      ? `<button class="circ off" type="button" data-do="mic" aria-label="${esc(T.mic)}">${ic('micOff')}</button>`
      : listening
        ? `<button class="circ rec" type="button" data-do="mic" aria-label="${esc(T.stopRec)}">${ic('stop')}</button>`
        : `<button class="circ" type="button" data-do="mic" aria-label="${esc(T.mic)}">${ic('mic')}</button>`;

    const sendBtn = running()
      ? `<button class="circ" type="button" data-do="noop" aria-label="${esc(T.stop)}">${ic('stop')}</button>`
      : `<button class="circ ${canSend ? 'go' : 'off'}" type="button" data-do="send" aria-label="${esc(T.send)}">${ic('send')}</button>`;

    const strip = {
      listening: ['say', T.listening, T.typeInstead],
      nearCap:   ['warn', T.wrapping, T.typeInstead],
      transcribing: ['say', T.transcribing, T.typeInstead],
      ready:     ['calm', '', T.notRight],
      nothing:   ['warn', T.nothingHeard, T.typeInstead],
      blocked:   ['bad', T.blocked, T.typeInstead],
      offline:   ['warn', T.micOffline, T.typeInstead],
      failed:    ['bad', T.micFailed, T.voiceRetry],
      tooLong:   ['warn', T.micTooLong, T.typeInstead],
    }[voice];

    const langs = voice === 'ready'
      ? `<div class="langs"><span>${T.heardIn}</span>
           <button class="on" type="button" data-do="noop">English</button>
           <button type="button" data-do="noop">ગુજરાતી</button>
           <button type="button" data-do="noop">हिन्दी</button></div>`
      : '';

    return `<form class="dock" onsubmit="return false">
      <div class="dock-in">
        <div class="pill-field${listening ? ' hot' : ''}${blocked() ? ' dim' : ''}">
          ${field}${micBtn}${sendBtn}
        </div>
        ${strip && (strip[1] || strip[2]) ? `<div class="vstrip ${strip[0]}" role="status">
            ${strip[1] ? `<span>${strip[1]}</span>` : ''}
            <a data-do="${voice === 'ready' ? 'mic' : 'typeInstead'}">${strip[2]}</a></div>` : ''}
        ${langs}
        <div class="dockfoot">
          <span>${blocked() ? T.draftKept : T.verify}</span>
          <span class="count${draft.length > 470 ? ' near' : ''}">${draft.length > 400 ? draft.length + ' / 500' : ''}</span>
        </div>
      </div>
    </form>`;
  };

  /* ── the whole screen ───────────────────────────────────────────────────────────────────── */
  function render() {
    const { name, turns } = topicName();
    const showCue = is('long','streaming');
    document.body.innerHTML = `
<div class="shell">
  <nav class="rail" aria-label="Main">
    <div class="logo">Clinket</div>
    <a href="#" data-do="noop">${ic('home')}${T.dashboard}</a>
    <a href="#" class="on" data-do="noop">${ic('mag')}${T.title}</a>
    <a href="#" data-do="noop">${ic('cal')}${T.bookings}</a>
    <a href="#" data-do="noop">${ic('bag')}${T.services}</a>
    <a href="#" data-do="noop">${ic('chat')}${T.inbox}</a>
    <a href="#" data-do="noop">${ic('graph')}${T.insights}</a>
    <div class="biz">${T.biz}</div>
  </nav>

  <div class="col">
    <header class="topbar">
      <div class="left">
        <button class="icobtn burger" type="button" data-do="noop" aria-label="Menu">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1>${T.title}</h1>
      </div>
      <div class="right">
        <button class="icobtn" type="button" data-do="focus" aria-label="${esc(T.title)}">${ic('mag')}</button>
        <button class="icobtn opt" type="button" data-do="noop" aria-label="Notifications">${ic('bell')}</button>
        <button class="icobtn opt" type="button" data-do="noop" aria-label="Language">EN</button>
      </div>
    </header>

    <section class="surface" aria-label="${esc(T.title)}">
      ${landing() ? '' : `
      <div class="topic">
        <button class="back" type="button" data-do="back">${ic('back')}<span>${T.back}</span></button>
        <span class="name"><b>${esc(name)}</b><small>${turns === 1 ? T.turnsOne : T.turnsMany.replace('{n}', turns)}</small></span>
        <button class="newbtn" type="button" data-do="new">${ic('plus')}<span>${T.newChat}</span></button>
      </div>`}

      <div class="scroll" id="scroll">
        <div class="inner${landing() ? ' bottom' : ''}">
          ${is('offlineState') ? `<div class="box amber"><b>${T.offlineTitle}</b>${T.offlineBody}</div>` : ''}
          ${landing() ? landingBlock() : transcript()}
          ${notices()}
        </div>
      </div>

      ${showCue ? `<span class="fade" aria-hidden="true"></span>
        <button class="cue${is('streaming') ? ' live' : ''}" type="button" data-do="newest"
          aria-label="${esc(T.scrollDown)}" title="${esc(T.scrollDown)}">
          ${ic('down')}${is('streaming') ? '<span class="nd"></span>' : ''}
        </button>` : ''}

      ${composer()}
    </section>

    ${is('keyboard') ? `<div class="kbd">${T.kbdLabel}
      <div class="krow">${'qwertyuiop'.split('').map(k=>`<span>${k}</span>`).join('')}</div>
      <div class="krow">${'asdfghjkl'.split('').map(k=>`<span>${k}</span>`).join('')}</div>
      <div class="space">${T.space}</div></div>` : ''}
  </div>
</div>`;

    const field = document.querySelector('.pill-field textarea');
    if (field) {
      field.oninput = () => {
        draft = field.value;
        const count = document.querySelector('.dockfoot .count');
        if (count) {
          count.textContent = draft.length > 400 ? draft.length + ' / 500' : '';
          count.className = 'count' + (draft.length > 470 ? ' near' : '');
        }
        const send = document.querySelector('[data-do="send"]');
        if (send) { send.className = 'circ ' + (draft.trim() ? 'go' : 'off'); }
        field.style.height = 'auto';
        field.style.height = Math.min(field.scrollHeight, 120) + 'px';
      };
      field.onkeydown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); act('send'); }
      };
    }
    document.querySelectorAll('[data-do]').forEach((el) => {
      el.onclick = (e) => { e.preventDefault(); act(el.dataset.do, el); };
    });
    document.querySelectorAll('details.src').forEach((d) => {
      d.ontoggle = () => {
        const ix = Number(d.dataset.i);
        if (d.open) { openAt.add(ix); } else { openAt.delete(ix); }
      };
    });
    const scroll = document.getElementById('scroll');
    if (scroll && !landing() && !is('long')) { scroll.scrollTop = scroll.scrollHeight; }
  }

  function ask(text) {
    const q = (text || '').trim();
    if (!q) { return; }
    asked.push(q);
    draft = '';
    state = 'conversation';
    render();
  }

  function act(what, el) {
    const ix = Number(el?.dataset?.i ?? 0);
    switch (what) {
      case 'copy':
        copiedAt.add(ix); render();
        clearTimeout(timer);
        timer = setTimeout(() => { copiedAt.delete(ix); render(); }, 2200);
        return;
      case 'up': case 'down':
        ratedAt.set(ix, what === 'up'); render(); return;
      case 'send': {
        const f = document.querySelector('.pill-field textarea');
        return ask(f ? f.value : draft);
      }
      case 'ask':
        return ask(el?.dataset?.q);
      case 'back':
        // keeps the draft — that is the whole difference from New conversation
        state = 'landing'; asked = []; sentTitle = null; showBase = false; render(); return;
      case 'new':
        state = 'landing'; asked = []; sentTitle = null; showBase = false; draft = ''; render(); return;
      case 'reopen':
        state = 'conversation'; asked = []; sentTitle = T.recent1; showBase = true;
        copiedAt = new Set(); ratedAt = new Map(); openAt = new Set(); render(); return;
      case 'focus':
        document.querySelector('.pill-field textarea')?.focus(); return;
      case 'newest':
        document.getElementById('scroll')?.scrollTo({
          top: document.getElementById('scroll').scrollHeight,
          behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'instant' : 'smooth',
        });
        return;
      case 'typeInstead':
        voice = null; clearInterval(timer); render();
        document.querySelector('.pill-field textarea')?.focus();
        return;
      case 'mic': {
        clearInterval(timer);
        if (voice === 'listening' || voice === 'nearCap') {
          voice = 'transcribing'; render();
          timer = setTimeout(() => {
            voice = 'ready';
            draft = 'Do we have a Caterpillar 352 for sale';
            render();
          }, 1400);
          return;
        }
        if (voice === 'blocked' || voice === 'offline') { return; }
        voice = 'listening'; clock = 0; render();
        timer = setInterval(() => {
          clock += 1;
          if (clock >= 50) { voice = 'nearCap'; }
          if (clock >= 60) { clearInterval(timer); voice = 'transcribing'; render(); return; }
          const c = document.querySelector('.clock');
          if (c) {
            c.innerHTML = `<b>${mm(clock)}</b> / 1:00`;
            c.className = 'clock' + (voice === 'nearCap' ? ' near' : '');
          } else { render(); }
        }, 1000);
        return;
      }
      default: return;
    }
  }

  render();
}
</script>
</body>
</html>
